<span
  class="nature-marker"
  [class.nature-marker--compact]="compact()"
  [attr.role]="compact() ? 'img' : null"
  [attr.aria-label]="compact() ? label() : null"
  [attr.title]="compact() ? label() : null"
>
  <svg class="nature-marker__icon" aria-hidden="true" viewBox="0 0 16 16">
    <path
      d="M8 1.2 C8.6 3.6 11.6 5.2 11.6 8.9 C11.6 11.7 10 14.8 8 14.8 C6 14.8 4.4 11.7 4.4 8.9 C4.4 7.4 5.1 6.4 5.9 5.4 C6.1 6.4 6.5 6.9 7 7.1 C6.8 4.9 7.2 3 8 1.2 Z"
      fill="none"
      stroke="currentColor"
      stroke-width="1.4"
      stroke-linejoin="round"
    />
  </svg>
  @if (!compact()) {
    <span class="nature-marker__label">{{ label() }}</span>
  }
</span>
