@if (mode() === 'joint') {
  <span class="identity-label identity-label--joint">
    <span class="identity-label__character">{{ characterName() }}</span>
    <span class="identity-label__player">{{ playerName() }}</span>
  </span>
} @else if (mode() === 'single-character') {
  <span class="identity-label identity-label--single" [attr.aria-label]="singleAriaLabel()">
    <svg class="identity-label__icon" aria-hidden="true" viewBox="0 0 16 16">
      <path
        d="M8 1 L15 3.5 V8 C15 11.5 11.8 14.2 8 15 C4.2 14.2 1 11.5 1 8 V3.5 Z"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linejoin="round"
      />
    </svg>
    <span class="identity-label__name">{{ characterName() }}</span>
  </span>
} @else if (mode() === 'single-player') {
  <span class="identity-label identity-label--single" [attr.aria-label]="singleAriaLabel()">
    <svg class="identity-label__icon" aria-hidden="true" viewBox="0 0 16 16">
      <circle cx="8" cy="5" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6" />
      <path
        d="M1.8 14.5 C1.8 10.6 4.6 9 8 9 C11.4 9 14.2 10.6 14.2 14.5"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
      />
    </svg>
    <span class="identity-label__name">{{ playerName() }}</span>
    @if (ambiguous() && pseudo()) {
      <span class="identity-label__pseudo">({{ pseudo() }})</span>
    }
  </span>
}
