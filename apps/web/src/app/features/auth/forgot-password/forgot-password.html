<app-auth-band />
<main class="auth-page" aria-labelledby="auth-title">
  <mat-card class="auth-card">
    <mat-card-header><h1 matCardTitle id="auth-title" class="auth-title">{{ tone()['common.mot_de_passe_oublie'] }}</h1></mat-card-header>
    <mat-card-content>
      <!-- Conteneur persistant : présent avant l'envoi pour que l'annonce du résultat ne soit pas perdue -->
      <div class="auth-status" role="status" tabindex="-1" #status>
        @if (sent()) {
          <p>{{ tone()['auth.forgot_sent'] }}</p>
        }
      </div>
      @if (!sent()) {
        <form [formGroup]="form" (ngSubmit)="submit()">
          <mat-form-field appearance="outline">
            <mat-label>{{ tone()['common.email'] }}</mat-label>
            <input
              matInput
              type="email"
              formControlName="email"
              appAuthAriaInvalid
              autocomplete="email"
            />
            <mat-error>{{ fieldError('email') }}</mat-error>
          </mat-form-field>
          @if (error()) {
            <p class="error" role="alert">{{ error() }}</p>
          }
          <button mat-flat-button class="auth-primary" type="submit" [disabled]="loading()">
            {{ tone()['auth.forgot_submit'] }}
          </button>
        </form>
      }
    </mat-card-content>
    <mat-card-actions class="auth-secondary-actions">
      <a class="auth-secondary-link" routerLink="/login">{{ tone()['common.retour_a_la_connexion'] }}</a>
    </mat-card-actions>
  </mat-card>
</main>
