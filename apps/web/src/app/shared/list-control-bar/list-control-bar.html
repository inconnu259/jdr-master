<div
  class="list-control-bar"
  [class.list-control-bar--hidden]="hiddenByScroll()"
  [class.list-control-bar--expanded]="expanded()"
>
  <div class="list-control-bar__row">
    <button
      type="button"
      mat-icon-button
      class="list-control-bar__toggle"
      [attr.aria-expanded]="expanded()"
      [attr.aria-label]="theme.tone()['list_control_bar.toggle_aria']"
      (click)="expanded.set(!expanded())"
    >
      <app-icon name="filtres" />
    </button>

    @if (isDesktop() && searchQuery() !== null) {
      <label class="list-control-bar__search">
        <app-icon name="rechercher" />
        <input
          type="text"
          [attr.aria-label]="searchLabel()"
          [ngModel]="searchQuery()"
          (ngModelChange)="searchQueryChange.emit($event)"
        />
      </label>
    }

    <div class="list-control-bar__modes" role="group" [attr.aria-label]="theme.tone()['list_control_bar.view_mode_group_aria']">
      @for (mode of viewModeOptions(); track mode) {
        <button
          type="button"
          mat-icon-button
          class="list-control-bar__mode"
          [class.list-control-bar__mode--active]="mode === viewMode()"
          [attr.aria-pressed]="mode === viewMode()"
          [attr.aria-label]="modeAriaLabel(mode)"
          (click)="viewModeChange.emit(mode)"
        >
          <app-icon [name]="modeIcon(mode)" />
        </button>
      }
    </div>

    @if (hasDeviatedFromDefault()) {
      <button type="button" mat-button class="list-control-bar__reset" (click)="resetRequested.emit()">
        <app-icon name="reinitialiser" />
        {{ theme.tone()['list_control_bar.reset_pill_label'] }}
      </button>
    }
  </div>

  <div class="list-control-bar__fields">
    @if (!isDesktop() && searchQuery() !== null) {
      <label class="list-control-bar__search list-control-bar__search--mobile">
        <app-icon name="rechercher" />
        <input
          type="text"
          [attr.aria-label]="searchLabel()"
          [ngModel]="searchQuery()"
          (ngModelChange)="searchQueryChange.emit($event)"
        />
      </label>
    }

    <label class="list-control-bar__field">
      <span class="list-control-bar__label">{{ theme.tone()['list_control_bar.sort_label'] }}</span>
      <select [ngModel]="sortValue()" (ngModelChange)="sortChange.emit($event)">
        @for (opt of sortOptions(); track opt.value) {
          <option [value]="opt.value">{{ opt.label }}</option>
        }
      </select>
    </label>

    <ng-content select="[extraFilters]" />
  </div>
</div>
