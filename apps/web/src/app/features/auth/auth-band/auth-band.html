<!-- Bande de marque des écrans d'authentification (story 34.4) : <header> frère de <main>, jamais de
     <h1> (le seul titre de l'écran reste celui de la carte). Le décor est purement décoratif. -->
<header class="band" [class.is-paused]="paused()">
  <div class="decor">
    <!-- Pause / reprise au clic ou au toucher sur le fond animé : écarts WCAG 2.2.2 (partiel) et
         2.1.1 consignés et acceptés par l'utilisateur (EXPERIENCE.md §11 j) — aucun bouton, non
         activable au clavier, état non mémorisé. Si le lint de gabarit se met à signaler cet élément
         (click-events-have-key-events, interactive-supports-focus), c'est précisément cet écart :
         le désactiver de façon ciblée, avec ce commentaire. -->
    <svg
      class="scene"
      viewBox="0 0 440 180"
      preserveAspectRatio="xMidYMid slice"
      aria-hidden="true"
      focusable="false"
      (click)="togglePause()"
    >
      @switch (scene()) {
        @case ('emeraude') {
          <defs>
            <radialGradient [attr.id]="ids.h1">
              <stop offset="0" class="sa1" stop-opacity=".55" />
              <stop offset=".55" class="sa1" stop-opacity=".25" />
              <stop offset="1" class="sa1" stop-opacity="0" />
            </radialGradient>
            <radialGradient [attr.id]="ids.h2">
              <stop offset="0" class="sa2" stop-opacity=".55" />
              <stop offset=".55" class="sa2" stop-opacity=".25" />
              <stop offset="1" class="sa2" stop-opacity="0" />
            </radialGradient>
            <linearGradient [attr.id]="ids.tail" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" class="sa1" stop-opacity="0" />
              <stop offset=".6" class="sa1" stop-opacity=".5" />
              <stop offset="1" class="sa1" stop-opacity=".95" />
            </linearGradient>
            <radialGradient [attr.id]="ids.head">
              <stop offset="0" class="st" stop-opacity="1" />
              <stop offset=".45" class="sa1" stop-opacity=".9" />
              <stop offset="1" class="sa1" stop-opacity="0" />
            </radialGradient>
            <!-- Emblème : grimoire ouvert surmonté d'une étoile à quatre branches -->
            <symbol [attr.id]="ids.emblem" viewBox="0 0 64 64">
              <circle cx="32" cy="32" r="30.5" class="fsurf" fill-opacity=".72" />
              <circle
                cx="32"
                cy="32"
                r="30.5"
                class="nf k1"
                stroke-width="1.5"
                stroke-opacity=".55"
              />
              <path class="f1" d="M32 51 C26 47 16 46 9 48 L9 28 C16 26 26 27 32 32 Z" />
              <path class="f1" d="M32 51 C38 47 48 46 55 48 L55 28 C48 27 38 26 32 32 Z" />
              <path class="nf ks rc" stroke-width="1.6" d="M32 32 V51" />
              <path
                class="nf ks rc"
                stroke-width="1.6"
                d="M14 34 C18 33 23 34 27 36 M14 39.5 C18 38.5 23 39.5 27 41.5 M50 34 C46 33 41 34 37 36 M50 39.5 C46 38.5 41 39.5 37 41.5"
              />
              <path
                class="nf k1 rc"
                stroke-width="2.6"
                d="M7 52 C16 50 26 51 32 56 C38 51 48 50 57 52"
              />
              <path
                class="f2"
                d="M32 4 L34.8 11.2 L42 14 L34.8 16.8 L32 24 L29.2 16.8 L22 14 L29.2 11.2 Z"
              />
              <circle class="f2" cx="46" cy="9" r="1.5" />
              <circle class="f2" cx="18" cy="10" r="1.5" />
            </symbol>
          </defs>
          <circle class="halo" cx="345" cy="52" r="84" [attr.fill]="refs.h2" />
          <circle class="halo" style="--d: -2.9s" cx="75" cy="150" r="64" [attr.fill]="refs.h1" />
          <use class="bgemb" [attr.href]="refs.emblem" x="245" y="-12" width="200" height="200" />
          <circle class="star" style="--d: -0.3s" cx="40" cy="28" r="1.2" />
          <circle class="star" style="--d: -2s" cx="110" cy="18" r="1.6" />
          <circle class="star" style="--d: -3.7s" cx="150" cy="62" r="1" />
          <circle class="star" style="--d: -1.1s" cx="34" cy="100" r="1.4" />
          <circle class="star" style="--d: -4.6s" cx="100" cy="112" r="1" />
          <circle class="star" style="--d: -5.8s" cx="175" cy="26" r="1.2" />
          <circle class="star" style="--d: -2.9s" cx="262" cy="20" r="1.4" />
          <circle class="star" style="--d: -0.3s" cx="300" cy="14" r="1.1" />
          <circle class="star" style="--d: -4.6s" cx="395" cy="24" r="1.6" />
          <circle class="star" style="--d: -2s" cx="410" cy="90" r="1.2" />
          <circle class="star" style="--d: -7s" cx="372" cy="128" r="1" />
          <circle class="star" style="--d: -1.1s" cx="330" cy="160" r="1.4" />
          <circle class="star" style="--d: -3.7s" cx="250" cy="168" r="1" />
          <circle class="star" style="--d: -5.8s" cx="190" cy="160" r="1.2" />
          <circle class="star" style="--d: -2.9s" cx="130" cy="150" r="1.6" />
          <circle class="star" style="--d: -7s" cx="62" cy="168" r="1" />
          <!-- Comète : invisible au repos (.fly à opacity 0 de base), elle n'existe qu'en mouvement -->
          <g transform="translate(58 34) rotate(21)">
            <g class="fly" style="--tr: 250px">
              <path d="M0 0 L62 -3.2 L62 3.2 Z" [attr.fill]="refs.tail" />
              <circle cx="62" cy="0" r="4.2" [attr.fill]="refs.head" />
            </g>
          </g>
        }
        @case ('foret') {
          <defs>
            <radialGradient [attr.id]="ids.h1">
              <stop offset="0" class="sa1" stop-opacity=".55" />
              <stop offset=".55" class="sa1" stop-opacity=".25" />
              <stop offset="1" class="sa1" stop-opacity="0" />
            </radialGradient>
            <radialGradient [attr.id]="ids.h2">
              <stop offset="0" class="sa2" stop-opacity=".55" />
              <stop offset=".55" class="sa2" stop-opacity=".25" />
              <stop offset="1" class="sa2" stop-opacity="0" />
            </radialGradient>
            <radialGradient [attr.id]="ids.mote">
              <stop offset="0" class="sa2" stop-opacity=".95" />
              <stop offset=".35" class="sa2" stop-opacity=".7" />
              <stop offset="1" class="sa2" stop-opacity="0" />
            </radialGradient>
            <!-- Emblème : feuille de chêne en contour, avec un point lumineux -->
            <symbol [attr.id]="ids.emblem" viewBox="0 0 64 64">
              <circle cx="32" cy="32" r="30.5" class="fsurf" fill-opacity=".72" />
              <circle
                cx="32"
                cy="32"
                r="30.5"
                class="nf k1"
                stroke-width="1.5"
                stroke-opacity=".55"
              />
              <path
                class="f1 k1 rc"
                fill-opacity=".22"
                stroke-width="3.2"
                d="M32 7 C36 7 37 12 39 13 C42 12 46 13 46 17 C46 21 44 22 43 24 C47 24 51 27 50 31 C50 35 46 36 44 37 C47 39 49 42 47 45 C45 48 40 47 38 47 C37 50 35 52 32 53 C29 52 27 50 26 47 C24 47 19 48 17 45 C15 42 17 39 20 37 C18 36 14 35 14 31 C13 27 17 24 21 24 C20 22 18 21 18 17 C18 13 22 12 25 13 C27 12 28 7 32 7 Z"
              />
              <path class="nf k1 rc" stroke-width="3.2" d="M32 53 V60" />
              <path class="nf k1 rc" stroke-width="2.2" d="M32 51 V34" />
              <circle class="nf k2" stroke-width="1.6" stroke-opacity=".55" cx="32" cy="27" r="9" />
              <circle class="f2" cx="32" cy="27" r="5" />
            </symbol>
          </defs>
          <circle class="halo" cx="82" cy="70" r="76" [attr.fill]="refs.h1" />
          <circle class="halo" style="--d: -3.7s" cx="362" cy="124" r="74" [attr.fill]="refs.h2" />
          <circle class="halo" style="--d: -1.1s" cx="250" cy="14" r="46" [attr.fill]="refs.h1" />
          <use class="bgemb" [attr.href]="refs.emblem" x="245" y="-12" width="200" height="200" />
          <circle
            class="mote"
            style="--d: -0.3s; --dx: 10px"
            cx="62"
            cy="150"
            r="5"
            [attr.fill]="refs.mote"
          />
          <circle
            class="mote"
            style="--d: -2.9s; --dx: -12px"
            cx="108"
            cy="168"
            r="4"
            [attr.fill]="refs.mote"
          />
          <circle
            class="mote"
            style="--d: -5.8s; --dx: 14px"
            cx="150"
            cy="140"
            r="5"
            [attr.fill]="refs.mote"
          />
          <circle
            class="mote"
            style="--d: -1.1s; --dx: -8px"
            cx="44"
            cy="96"
            r="4"
            [attr.fill]="refs.mote"
          />
          <circle
            class="mote"
            style="--d: -3.7s; --dx: 10px"
            cx="196"
            cy="170"
            r="4"
            [attr.fill]="refs.mote"
          />
          <circle
            class="mote"
            style="--d: -7s; --dx: -14px"
            cx="262"
            cy="158"
            r="5"
            [attr.fill]="refs.mote"
          />
          <circle
            class="mote"
            style="--d: -2s; --dx: 12px"
            cx="318"
            cy="172"
            r="4"
            [attr.fill]="refs.mote"
          />
          <circle
            class="mote"
            style="--d: -4.6s; --dx: -10px"
            cx="372"
            cy="150"
            r="5"
            [attr.fill]="refs.mote"
          />
          <circle
            class="mote"
            style="--d: -0.3s; --dx: 8px"
            cx="404"
            cy="112"
            r="4"
            [attr.fill]="refs.mote"
          />
          <circle
            class="mote"
            style="--d: -5.8s; --dx: -12px"
            cx="346"
            cy="96"
            r="4"
            [attr.fill]="refs.mote"
          />
          <circle
            class="mote"
            style="--d: -2.9s; --dx: 10px"
            cx="128"
            cy="92"
            r="3.5"
            [attr.fill]="refs.mote"
          />
        }
        @case ('atelier') {
          <defs>
            <pattern [attr.id]="ids.grid" width="13" height="13" patternUnits="userSpaceOnUse">
              <path d="M13 0H0V13" class="nf k1" stroke-width=".5" />
            </pattern>
            <radialGradient [attr.id]="ids.steam">
              <stop offset="0" class="st" stop-opacity=".3" />
              <stop offset="1" class="st" stop-opacity="0" />
            </radialGradient>
            <!-- Rouage de douze dents (peint en currentColor par le .gc1 / .gc2 de l'appelant) -->
            <g [attr.id]="ids.gear">
              <g fill="currentColor">
                @for (angle of gearTeeth; track angle) {
                  <rect
                    x="46"
                    y="2"
                    width="8"
                    height="14"
                    rx="1.5"
                    [attr.transform]="'rotate(' + angle + ' 50 50)'"
                  />
                }
              </g>
              <circle cx="50" cy="50" r="36" fill="none" stroke="currentColor" stroke-width="7" />
              <circle cx="50" cy="50" r="12" fill="none" stroke="currentColor" stroke-width="5" />
            </g>
            <!-- Emblème : rouage de huit dents dont le moyeu est un dé -->
            <symbol [attr.id]="ids.emblem" viewBox="0 0 64 64">
              <circle cx="32" cy="32" r="30.5" class="fsurf" fill-opacity=".72" />
              <circle
                cx="32"
                cy="32"
                r="30.5"
                class="nf k1"
                stroke-width="1.5"
                stroke-opacity=".55"
              />
              <g class="f1">
                @for (angle of emblemTeeth; track angle) {
                  <rect
                    x="28"
                    y="4"
                    width="8"
                    height="12"
                    rx="2"
                    [attr.transform]="'rotate(' + angle + ' 32 32)'"
                  />
                }
              </g>
              <circle class="f1" cx="32" cy="32" r="23" />
              <rect class="f2 ks" stroke-width="2.4" x="19" y="19" width="26" height="26" rx="6" />
              <g class="ft">
                <circle cx="25.5" cy="25.5" r="2.5" />
                <circle cx="38.5" cy="25.5" r="2.5" />
                <circle cx="32" cy="32" r="2.5" />
                <circle cx="25.5" cy="38.5" r="2.5" />
                <circle cx="38.5" cy="38.5" r="2.5" />
              </g>
            </symbol>
          </defs>
          <rect class="grid-rect" x="0" y="0" width="440" height="180" [attr.fill]="refs.grid" />
          <g transform="translate(-14 100) scale(.85)">
            <g class="spin" style="transform-origin: 50px 50px">
              <use class="gc1" [attr.href]="refs.gear" />
            </g>
          </g>
          <g transform="translate(352 96) scale(.8)">
            <g class="spin rev slow" style="transform-origin: 50px 50px">
              <use class="gc2" [attr.href]="refs.gear" />
            </g>
          </g>
          <g transform="translate(380 51) scale(.5)">
            <g class="spin fast" style="transform-origin: 50px 50px">
              <use class="gc1" [attr.href]="refs.gear" />
            </g>
          </g>
          <use class="bgemb" [attr.href]="refs.emblem" x="245" y="-12" width="200" height="200" />
          <circle class="rivet f1" cx="44" cy="12" r="2" />
          <circle class="rivet f1" cx="396" cy="12" r="2" />
          <circle class="rivet f1" cx="44" cy="168" r="2" />
          <circle class="rivet f1" cx="396" cy="168" r="2" />
          <circle
            class="puff"
            style="--d: -0.3s"
            cx="306"
            cy="160"
            r="9"
            [attr.fill]="refs.steam"
          />
          <circle
            class="puff"
            style="--d: -2.9s"
            cx="318"
            cy="164"
            r="7"
            [attr.fill]="refs.steam"
          />
          <circle
            class="puff"
            style="--d: -5.8s"
            cx="298"
            cy="166"
            r="8"
            [attr.fill]="refs.steam"
          />
          <!-- Manomètre : l'aiguille prend la teinte « à faire » du thème -->
          <g transform="translate(58 18)">
            <circle cx="20" cy="20" r="20" class="fsurf" />
            <circle cx="20" cy="20" r="18.5" class="nf k1" stroke-width="3" />
            <g transform="translate(20 20)">
              <g class="needle">
                <line x1="0" y1="0" x2="-5.9" y2="-10" class="kn rc" stroke-width="2" />
              </g>
            </g>
            <circle cx="20" cy="20" r="2.5" class="f1" />
          </g>
        }
      }
    </svg>
  </div>
  <div class="brand">
    <div class="bm">
      <app-brand-logo />
      <span class="nm">Dés Dispos</span>
    </div>
    <p class="tag">{{ tagline() }}</p>
  </div>
</header>
