  36-1-le-rail-de-detail:
    status: done
    epic: epic-36
    title: "Le rail de détail"
    last_updated: "2026-08-18"
    note: "Story 36-1 → done : 6 patches de la revue de code (bmad-code-review, 2026-08-17) appliqués — bordures rgba() codées en dur remplacées par var(--mat-sys-outline-variant, #ccc) (calendar-detail-rail.scss), sélecteur .it:first-of-type (ne matchait jamais) corrigé en .it:first-child, railDateKey dérive désormais de allCalendarEntries() (liste complète) au lieu de agendaEntries() (liste filtrée par couches actives) pour respecter « le rail suit, il ne se commande pas », doublon séance/vote sur le même jour/créneau signalé par un indicateur textuel « (+1 autre) » au lieu de disparaître silencieusement (décision utilisateur 2026-08-17, 3 tests dédiés ajoutés), RailSlot dérivé via Exclude<DaySlot, 'FULL_DAY'> au lieu d'une union dupliquée à la main, SLOT_NAMES retypé Record<RailSlot, string> au lieu de Record<string, string>. 3 items différés (defer) laissés tels quels : vote masqué par une séance sur le même créneau, indicateur loading du rail sans slotsLoading (pré-existant), couverture de test AC7 incomplète. Web 102/102 fichiers, 1619/1619 tests verts (+3 vs baseline 1616), lint 143/143 erreurs pré-existantes inchangé (aucune nouvelle erreur sur les fichiers touchés), aucune régression. HISTORIQUE : Story créée le 2026-08-17 (bmad-create-story). Première story de l'épic 36. Trois encadrés consignés : (1) le rail est un CONSOMMATEUR PASSIF (principe d'arbitrage n°2 de la spine UX) et onSlotSelected (calendar-view.ts:507-513) est l'UNIQUE point d'entrée de clic existant — il ouvre le ConstraintPanel et ses signaux selectedDate/selectedSlot sont liés à panelOpen/closePanel(), donc le rail exige des signaux dédiés sous peine de se vider à chaque fermeture du panneau ; (2) ZERO APPEL RESEAU — agendaEntries() (calendar-view.ts:242-352) fait déjà la dérivation par couche pour les deux contextes (partie via scenarios()/activePolls()/heatmap(), personnel via GET /me/calendar), le rail en extrait une fonction pure au lieu de bâtir un second pipeline (AD-18, AD-3) ; (3) TROIS ECARTS ASSUMES au contrat d'UI, chacun marqué ⚠️ avec son motif — rail permanent aux deux vues et à toutes largeurs (la spine dit qu'il disparaît ≥500px, l'AC1 dit « en permanence » : on suit epics.md, le seuil revient à 36.13/Q-24), portée « jour » en vue Semaine (le contrat la scope au créneau), trois créneaux toujours listés (le rendu mobile du contrat n'en montre que deux, l'AC4 exige qu'un jour vide le dise). DIX AC : les quatre d'epics.md verbatim (AC1-AC4) + AC5 zéro appel réseau, AC6 la couche gouverne le TEXTE jamais l'indisponibilité (FR-50), AC7 aucune séance d'une autre partie nommée en contexte de partie (AD-9), AC8 jamais la couleur seule (P-1), AC9 non-régression de saisie, AC10 région live. Point ouvert n°11 de la spine UX tranché (le rail suit la dernière case touchée, pas la sélection multiple). Evaluation SSE faite : aucun câblage propre (composant imbriqué dans un écran déjà connecté, computed() sur les mêmes signaux, dette /me/calendar héritée non aggravée). Story front-only. Baseline à confirmer : web 100 fichiers / 1560 tests. TROIS DECISIONS UTILISATEUR ACTEES le 2026-08-17 : (a) rail permanent aux deux vues ET en desktop, la largeur sert a deplier l'info (ecart assume vs EXPERIENCE.md:697 et annotation 27 du contrat) ; (b) les TROIS creneaux toujours listes, Matin compris, a toutes les largeurs (ecart assume vs le rendu mobile du contrat qui n'en montre que deux) ; (c) AC11 AJOUTEE avec sa REGLE GENERALE — le rail nomme une chose et ouvre le niveau AU-DESSUS : une ligne decrit une seance, l'activer ouvre LE SCENARIO qui la porte (/parties/:id/scenarios/:scenarioId). Ce n'est pas un repli mais le niveau qui porte le contexte utile (chronologie, autres seances, compte rendu). Constat d'analyse concordant : AUCUNE fenetre de seance n'existe dans l'application (aucun composant, aucun dialogue, aucune route ; seance-list.ts:86 va du scenario VERS le calendrier) — la story ne cree aucun composant de detail de seance. Cette regle PRECISE EXPERIENCE.md:571 et VAUT AUSSI POUR LA STORY 36.11, dont l'AC vise la meme cible. Second trou de donnees identifie : AgendaEntry ne porte aucun identifiant navigable, partieId/scenarioId/seanceId a ajouter en champs additifs. ONZE AC au total. A REPERCUTER HORS STORY : les points (a) et (b) modifient contrat-ui-calendrier.html et la table de densite d'EXPERIENCE.md §9 ; le point (c) precise la table d'actions d'EXPERIENCE.md:571 et retentit sur la story 36.11 — planches et epics.md non edites, a passer par bmad-ux / bmad-correct-course."

  36-2-la-case-du-mois-trois-bandes-et-la-preseance:
    status: done
    epic: epic-36
    last_updated: "2026-08-18"
    note: "Story creee le 2026-08-18 (bmad-create-story), trois sous-agents d'exploration. ECRITE ALORS QUE 36.1 EST EN REVIEW (choix utilisateur) : elle s'appuie sur day-detail.utils.ts et allCalendarEntries() livres hier ; si la revue de 36.1 les modifie, repasser sur les Tasks 1 et 2. TROIS ENCADRES : (1) LA PRESEANCE EXISTE DEJA A MOITIE — buildDayDetail() arbitre deja seance > declaration ; la story l'acheve par un champ 'winner' et une table nommee servant RAIL ET CASE, au lieu d'un second module ; elle referme un item de deferred-work (vote masque par une seance, non tranche formellement). PRESEANCE A QUATRE RANGS, pas cinq : 'non declare' n'est pas un rang, et la disponibilite du groupe en est SORTIE le 2026-08-17 (FR-53) -> story 36.8. (2) DONNEES DEJA LA, par creneau type et NON FILTREES : allCalendarEntries() couvre les deux contextes sans appel supplementaire ; les inputs [heatmap]/[seanceDates] du Mois sont a remplacer MAIS seanceMarkerDates() reste requis par la vue Semaine. (3) ⚠️ TROIS ECARTS entre la planche contractuelle et la spec ecrite, chacun tranche avec son motif : FORME DU VOTE (liseré gauche 3px retenu contre le filet des maquettes — sinon seance et vote ne se distinguent que par la couleur, ce que P-1 interdit ; la planche devra etre corrigee), TEXTE EN MOBILE (aucun texte : trois textes concordants contre un detail de rendu de la planche), CONDITION DE FUSION (la 3e condition de la planche appartient a 36.8). TREIZE AC : les dix d'epics.md verbatim + AC11 (seance sans vote = FULL_DAY = trois bandes, AD-9), AC12 (42 arrets de tabulation, pas 126), AC13 (zero appel reseau). PIEGES CONSIGNES : align-items:center sur .day-cell empeche mecaniquement les bandes pleine largeur ; --jdr-status-unavailable et --jdr-status-unknown N'EXISTENT PAS dans styles.scss (les vrais sont --color-unavailable / --color-unknown) ; 'disponibilites = accent-1' est faux hors Grimoire Emeraude (utiliser --color-available) ; DEUX TESTS EXISTANTS ciblant .segment vont casser et doivent etre REECRITS sur .band, pas supprimes (ils protegent le mecanisme fromSegment). Baseline a confirmer : web 102 fichiers / 1616 tests, lint 143 erreurs pre-existantes, build 1,36 Mo. TROIS QUESTIONS remontees a l'utilisateur : forme du vote, container query vs media query pour le seuil de 100px de largeur de CASE (le dossier n'a que des seuils d'ecran, et en contexte de partie le panneau lateral fausse l'equivalence), et la perte temporaire de la tendance du groupe entre 36.2 et 36.8."
    title: "La case du mois, trois bandes et la préséance"

