<main class="auth-page" aria-labelledby="auth-title">
  <mat-card class="auth-card">
    <mat-card-header>
      <h1 matCardTitle id="auth-title" class="auth-title">Confirmer le changement d'adresse e-mail</h1>
    </mat-card-header>
    <mat-card-content>
      @if (!token()) {
        <!-- Présent dès le chargement : texte simple, sans role="alert" -->
        <p class="error">Lien invalide.</p>
      }
      <!-- Conteneur persistant : présent avant l'action pour que l'annonce de la réussite ne soit pas perdue -->
      <div class="auth-status" role="status" tabindex="-1" #status>
        @if (confirmed()) {
          <p class="saved">Votre adresse e-mail a été changée.</p>
        }
      </div>
      @if (!confirmed()) {
        @if (error()) {
          <p class="error" role="alert">{{ error() }}</p>
        }
        <button
          mat-flat-button
          class="auth-primary"
          type="button"
          [disabled]="loading() || !token()"
          (click)="confirm()"
        >
          Confirmer
        </button>
      }
    </mat-card-content>
    <mat-card-actions class="auth-secondary-actions">
      <a class="auth-secondary-link" routerLink="/login">Retour à la connexion</a>
    </mat-card-actions>
  </mat-card>
</main>
