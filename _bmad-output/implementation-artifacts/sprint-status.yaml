    review_note: "REVUE DE CODE (bmad-code-review) le 2026-08-22 : 3 couches paralleles (Blind Hunter, Edge Case Hunter, Acceptance Auditor), 4 patch tous corriges (classe d'hote gg--pastilles morte retiree de GroupGauge ; orderBy de resolveParticipants() departage par userId, joinedAt seul permettait a deux membres invites ensemble de permuter d'une requete a l'autre ; loadHeatmap() gagne un jeton de requete incremental, meme patron que meCalendarReqId, contre une reponse perimee ecrasant une plus recente lors d'une navigation rapide ; un echec de loadHeatmap() vide desormais la couche au lieu de laisser une donnee perimee a l'ecran), 3 differes (isNamedSlot() sans garde defensive si un payload malforme ne portait ni total ni members, risque theorique le typage partage garantit total ; groupEntry = sameDay.find() prend silencieusement la premiere correspondance en cas de doublon hypothetique ; couleur UNKNOWN manquante dans le rail — resolue entre-temps par la demande utilisateur ci-dessous), 7 rejetes comme bruit (zip positionnel participants/statuses dans getHeatmap verifie aligne par construction ; hasGroupChannel() desactivant la fusion du jour entier verifie conforme a l'encadre n°3/AC11 ; masquage du mot de statut sous 500px verifie ne pas etre couleur-seule et documente ; orderBy partage verifie intentionnel meme cle que listMembers() ; groupAriaLabel omettant le compte unknown verifie conforme a l'AC15 litteral ; double enveloppe isNamedSlot/isMjSlot verifiee encapsulation raisonnable ; risque de role=img imbrique dans le rail verifie faux positif, branches @if/@else mutuellement exclusives). Demande utilisateur en meme passe : le rail perdait TOUTE information de disponibilite sous 500px (mot de statut masque, rien ne le remplacait) — colorisation du nom du membre par statut (rouge/vert/gris, lien visuel avec les pastilles des autres surfaces) + glyphe court D/I/? qui double le nom sous 500px pour ne jamais retomber sur la couleur seule (P-1). Post-patch :