<div class="scenario-drafts">
  <div class="header">
    <h2>Brouillons</h2>
    <button mat-flat-button type="button" (click)="newScenario()">+ Nouveau scénario</button>
  </div>

  @if (loadError()) {
    <p class="error">{{ loadError() }}</p>
  } @else if (drafts().length === 0) {
    <p class="empty">Aucun brouillon pour l'instant.</p>
  } @else {
    <ul>
      @for (draft of drafts(); track draft.id) {
        <li
          class="draft-row"
          role="button"
          tabindex="0"
          (click)="openScenario(draft)"
          (keydown.enter)="openScenario(draft)"
          (keydown.space)="$event.preventDefault(); openScenario(draft)"
        >
          <span>{{ draft.title }}</span>
          <!-- Story 32.3 — onglet MJ-only (`PartieDetail` ne le rend jamais à un joueur) : le
               badge « Brouillon » ne peut donc atteindre personne d'autre. -->
          <app-scenario-status-badge [status]="draft.status" />
          <button mat-button type="button" (click)="openToPlayers(draft, $event)">
            Ouvrir aux joueurs
          </button>
        </li>
      }
    </ul>
  }
</div>
