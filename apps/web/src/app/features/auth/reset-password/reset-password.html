<main class="auth-page" aria-labelledby="auth-title">
  <mat-card class="auth-card">
    <mat-card-header><h1 matCardTitle id="auth-title" class="auth-title">Nouveau mot de passe</h1></mat-card-header>
    <mat-card-content>
      @if (!token()) {
        <!-- Présent dès le chargement : texte simple, sans role="alert" -->
        <p class="error">Lien invalide.</p>
      }
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline">
          <mat-label>Nouveau mot de passe</mat-label>
          <input
            matInput
            type="password"
            formControlName="newPassword"
            appAuthAriaInvalid
            autocomplete="new-password"
            appPasswordReveal
            #pw="appPasswordReveal"
          />
          <app-password-toggle matSuffix [for]="pw" />
          <mat-hint>8+ caractères</mat-hint>
          <mat-error>{{ fieldError('newPassword') }}</mat-error>
        </mat-form-field>
        @if (error()) {
          <p class="error" role="alert">{{ error() }}</p>
        }
        <button mat-flat-button class="auth-primary" type="submit" [disabled]="loading() || !token()">
          Réinitialiser
        </button>
      </form>
    </mat-card-content>
    <mat-card-actions class="auth-secondary-actions">
      @if (!token() || error()) {
        <a class="auth-secondary-link" routerLink="/forgot-password">Refaire une demande</a>
      }
      <a class="auth-secondary-link" routerLink="/login">Retour à la connexion</a>
    </mat-card-actions>
  </mat-card>
</main>
