<button
  type="button"
  class="toggle"
  [attr.aria-pressed]="for().revealed()"
  [attr.aria-label]="label()"
  (click)="onClick($event)"
>
  @if (for().revealed()) {
    <!-- Visible : œil barré -->
    <app-icon name="oeil-barre" />
  } @else {
    <!-- Masqué : œil -->
    <app-icon name="oeil" />
  }
</button>
