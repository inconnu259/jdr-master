    note: "Story creee le 2026-08-18 (bmad-create-story), exploration menee en direct apres echec des sous-agents sur limite de session. QUATRE ENCADRES. (1) LE TAP CESSE D'OUVRIR LE PANNEAU — renversement explicite de l'AC9 de 36.1 et de l'AC9 de 36.2, qui garantissaient toutes deux le contraire ; onSlotSelected() est AMPUTE, pas supprime (le rail continue de suivre, AC2 de 36.1) ; ConstraintPanel n'a plus qu'une porte, « Autre… », dont dependent TROIS capacites livrees — contrainte recurrente (story 1.7), modification/suppression, decoupe : c'est le risque n°1 de la story, verrouille par les AC4 et AC10. (2) LA BARRE EXISTE DEJA (selection-bar/, livree par 30.3, rendue par les DEUX vues) : elle gagne une portee a quatre segments, « Autre… » et une intention armee — ne pas creer un second composant ; ⚠️ AUCUNE section de DESIGN.md ne la specifie (7.9 case, 7.9 bis jauge, 7.10 icones, 7.10 bis rail, 7.11 legende), le seul contrat visuel est .selbar/.scope de contrat-ui-calendrier.html, qui ne la dessine qu'en desktop. (3) « CE QUE LA BARRE AFFICHE » SUPPOSE UN ETAT QUE LA BARRE N'A PAS : la barre montre deux boutons d'egale valeur et la planche n'en marque aucun ; decision d'une INTENTION ARMEE visible par la FORME (mat-flat vs mat-stroked + aria-pressed, jamais la couleur seule — P-1), defaut UNAVAILABLE — ce qui referme la dette n'est donc pas un changement de valeur mais l'accord enfin obtenu entre les deux chemins. (4) TROIS ECARTS ENTRE DOCUMENTS TRANCHES : la selection porte un CRENEAU PAR CELLULE (SelectedCell) dans les deux vues, y compris le Mois — ⚠️ ecart assume vs la puce 2 de FR-57, contredite par la collision 1 d'EXPERIENCE.md du meme jour ; le TEST D'AXE NE GOUVERNE QUE L'ARMEMENT, jamais l'extension (le tactile est deja couvert par l'appui maintenu, c'est la souris qui manque de garde) ; la PORTEE INITIALE REFLETE L'ORIGINE de la selection (creneau de la bande touchee, Journee depuis le corps de la case, un jour fusionne ou Espace). QUATORZE AC : les neuf d'epics.md verbatim + AC10 (le panneau garde modification/suppression/decoupe par sa nouvelle porte, avec selectedExisting renseigne), AC11 (le rail continue de suivre), AC12 (un geste = un appel, AD-21), AC13 (42 arrets de tabulation et non 126, portee en un seul radiogroup), AC14 (la barre lisible sans la voir et sans la couleur seule). ⚠️ REGRESSION TEMPORAIRE ASSUMEE CONSIGNEE entre 36.3 et 36.4 : redeclarer un creneau DEJA declare echouera la ou le tap le permettait, le tap unitaire passant desormais par la route groupee qui echoue en bloc (AD-21) alors que ConstraintPanel savait ecraser et decouper ; mitigee par « Autre… » (AC10) et par un message d'echec qui doit le nommer. SIX TESTS EXISTANTS CHANGENT DE VERITE et doivent etre REECRITS, pas supprimes : calendar-month-view.spec.ts:302,348,373 · calendar-week-view.spec.ts:183,322,344 · calendar-view.spec.ts:1175. Douze pieges consignes, dont l'absence de preventDefault sur keydown.space en vue Mois (la vue Semaine l'a, pas le Mois — Espace fera defiler la page) et le cablage de « Autre… » sans selectedExisting. Dette REFERMEE : les deux points de l'encadre de dette d'EXPERIENCE.md §6 bis (Entree validant indisponible d'office ; Entree et Espace produisant le meme effet hors selection). Dette LAISSEE OUVERTE avec son motif ecrit : l'extension clavier Haut/Bas en vue Mois, triplement ambigue une fois la portee introduite. Evaluation SSE faite : aucun cablage propre (etat local d'interaction, chaine de validation inchangee depuis 30.2, dette /me/calendar heritee non aggravee). Story front-only. Baseline : web 102 fichiers / 1654 tests, lint 143 erreurs pre-existantes, build 1,36 Mo. CINQ QUESTIONS REMONTEES A L'UTILISATEUR : (a) le sens exact de « ce que la barre affiche » ; (b) faut-il rapprocher la story 36.4 pour raccourcir la regression temporaire ; (c) TROU D'ATTRIBUTION — le tap sur une bande portant une seance doit ouvrir le scenario (EXPERIENCE.md table 1 + precision du 2026-08-17) mais AUCUNE story de l'epic ne l'a en AC (36.2 l'a mis hors perimetre, 36.3 ne parle que des bandes sans objet pose, 36.5 traite le texte d'infos pratiques, 36.7 le selecteur de vote) ; (d) le comportement d'« Autre… » sur une selection de plusieurs jours, ConstraintPanel ne prenant qu'une date et un creneau ; (e) A REPERCUTER HORS STORY : la contradiction entre la puce 2 de FR-57 et la collision 1 d'EXPERIENCE.md §6 bis — prd.md non edite, a passer par bmad-correct-course."

  36-4-resolution-de-conflits-sur-lecriture-groupee:
    status: done
    epic: epic-36
    title: "Résolution de conflits sur l'écriture groupée"
    last_updated: "2026-08-19"
    note: "IMPLEMENTEE le 2026-08-19 (bmad-dev-story), Tasks 1 a 9. La route groupee absorbe desormais la resolution de conflits ET la decoupe de la story 1.7 (D-18) : deux AC de 30.2 renversees (AC2 echec en bloc, AC8 la garde), les sept autres tiennent et sont couvertes. TROU PRINCIPAL CONFIRME A L'IMPLEMENTATION : createBatch() ne renvoyait QU'UN SEUL conflit (find + throw au premier item fautif), rendant l'AC2 mecaniquement inatteignable ; la boucle collecte maintenant tous les couples (creneau, declaration). DECOUPE ENTREE DANS LE LOT PAR EXTRACTION : createWithHoles() ouvrait sa propre $transaction, son calcul est isole dans buildHolePieces() pure ; le chemin unitaire est strictement inchange (tests keep + 12 cas de splitOccurrence passent sans modification). Une seule transaction, un seul updateMany groupe, une seule emission SSE ; tout calcule AVANT d'ouvrir la transaction (timeout par defaut 5 s, la decoupe multipliant les ecritures). « REMPLACER NE TOUCHE QUE MES PROPRES DECLARATIONS » N'A DEMANDE AUCUNE LIGNE DE CODE — l'indisponibilite derivee n'est jamais persistee ; le travail a ete de l'AFFICHER (ligne d'exception, non actionnable, batie cote client depuis allCalendarEntries(), zero appel reseau) et de la verrouiller par des tests. « AU CAS PAR CAS » entierement client : le dialogue ne connait aucun service HTTP, un geste resolu produit EXACTEMENT DEUX appels et zero pendant le defile. DISASTER N°1 REEL : les deux vues effacent leur selection avant la reponse, CalendarView retient donc event.cells (sans quoi ni le nommage ni la re-soumission n'etaient possibles) ; les vues n'ont pas ete touchees. ⚠️ UN FICHIER HORS DE LA LISTE « NON TOUCHES » a du etre modifie : core/availability/availability.service.ts, pour que ConflictError porte batchIndex — seule cle reliant un conflit a une cellule nommable, les dates de ConflictInfo etant celles de la declaration EXISTANTE. ⚠️ ConstraintPanel N'A PAS ETE MIGRE (garde levee ≠ migration demandee, et zero test de composant) : les vocabulaires « Ecraser/Garder l'existant » et « Remplacer/Conserver » COEXISTENT — question n°3 ouverte. Conflit interne au lot toujours irresoluble, distingue cote front par les id synthetiques batch-item-N. API 58 suites / 1245 tests (baseline 1232, +13), typecheck 0, lint src/availability 22 = baseline. Web 103 fichiers / 1709 tests (baseline 102/1686, +23), lint 143 = baseline, build en echec sur le seul budget de bundle pre-existant (1,37 -> 1,38 Mo). AUCUNE MIGRATION PRISMA. ✅ VERIFICATION VISUELLE REELLE FAITE dans Chrome sur des donnees reelles — ELLE A TROUVE QUATRE DEFAUTS QU'AUCUN TEST NE VOYAIT, tous corriges : accord manquant (« Les 4 deviennent disponible »), separateur ambigu dans la liste des creneaux nommes (le meme ' · ' separait la date du creneau ET deux creneaux entre eux — le creneau est desormais omis quand il vaut la journee entiere, comme le fait le contrat d'UI ; 2 tests ajoutes), libelle et consequence empiles-centres par Material au lieu d'etre alignes a gauche, barre de defilement parasite en mode defile. PREUVE LA PLUS FORTE OBTENUE A L'ECRAN : quatre creneaux indisponibles redeclares disponibles avec des decisions MIXTES (Remplacer/Conserver/Remplacer/Conserver) donnent 20 vert, 21 rouge, 22 vert, 23 rouge, etat qui survit au rechargement — chaque decision n'a porte que sur son creneau, en une seule transaction ; annuler en cours de defile apres une decision deja prise n'ecrit rien. Web 103 fichiers / 1711 tests apres correctifs, lint 143 = baseline. Non verifie a l'oeil : rendu en largeur telephone (aucune planche ne le dessine) et ligne d'exception ✦ d'une seance, tous deux couverts par des tests. ❌ RESTE /SECURITY-REVIEW, non optionnel sur cette story. Six questions de la creation restent ouvertes, dont l'amendement d'AD-21. HISTORIQUE : Story creee le 2026-08-19 (bmad-create-story), trois sous-agents d'exploration en parallele. SEULE STORY SERVEUR de la premiere moitie de l'epic (D-18), /security-review NON OPTIONNEL. CINQ ENCADRES. (1) DEUX AC SEULEMENT DE 30.2 SONT RENVERSEES — AC2 (echec en bloc) et AC8 (la garde interdisant de faire passer ConstraintPanel par la route groupee) ; les sept autres (AC1 appel unique, AC3 transactionnel, AC4, AC5 conflits internes, AC6 lecture unique, AC7 emission unique, AC9/AC10 validation) restent des INVARIANTS, tableau consigne. ⚠️ POINT DE GOUVERNANCE : AD-21 est toujours [ADOPTED] et dit litteralement l'inverse, la spine s'arretant a FR-48 (aucune AD ne couvre l'epic 36) ; le sprint-change du 2026-08-17 demandait de traiter ce trou AVANT 36.4. (2) TROU LE PLUS CONCRET, TROUVE EN LISANT LE CODE ET ECRIT NULLE PART AILLEURS : createBatch() tronque DEUX FOIS (find + throw au premier item fautif, availability.service.ts:265-275) et ne renvoie donc QU'UN SEUL conflit — le dialogue exige par l'AC2 et par la planche contractuelle (« 3 creneaux sont deja declares … Mar 4 · Ven 7 · Dim 9 ») est INATTEIGNABLE en l'etat, d'ou l'AC9. Le transport existe deja (BatchConflictInfo.batchIndex, livre par 30.2) mais calendar-view.ts:621 le jette. (3) « REMPLACER NE TOUCHE QUE MES PROPRES DECLARATIONS » N'EST PAS DU CODE A ECRIRE : verifie, l'indisponibilite derivee est construite en memoire sans id (availability.service.ts:711-719) et la detection ne lit que AvailabilityDeclaration (:261) — le travail est un AFFICHAGE (ligne rose) plus un test de non-regression. ⚠️ Ecart tranche entre les deux planches : le contrat d'UI (qui ne nomme PAS la seance) l'emporte sur la planche E (qui la nomme « Le Convoi du Nord »), pour un motif TECHNIQUE autant que d'autorite — la donnee derivee ne porte aucune identite. La ligne se construit cote client depuis allCalendarEntries(), zero appel reseau. (4) LEVER LA GARDE ≠ MIGRER : ConstraintPanel reste sur la route unitaire, aucun AC ne demande la migration, et il n'a AUCUN test de composant (spec de 75 lignes ne testant qu'une fonction pure) — y toucher serait refactorer sans filet. (5) « AU CAS PAR CAS » N'EST SPECIFIE NULLE PART (une phrase d'EXPERIENCE.md, AUCUNE section de DESIGN.md, AUCUN mockup de l'ecran) : tranche en PARCOURS ENTIEREMENT CLIENT, aucun appel pendant le defile, un seul envoi final — ce qui referme aussi le seul endroit ou le limiteur de debit redeviendrait un vrai sujet. Consequence de contrat : la resolution est PAR ITEM (conflictResolution sur CreateAvailabilityBatchItem), pas globale au lot ; un seul contrat couvre les trois issues. SEIZE AC : les huit d'epics.md verbatim + AC9 (409 exhaustif), AC10 (un geste un appel, « Au cas par cas » compris), AC11 (ligne d'exception affichee, non actionnable, sans appel), AC12 (FERMETURE DE LA REGRESSION TEMPORAIRE ASSUMEE PAR 36.3 — redeclarer un creneau deja declare echoue aujourd'hui), AC13 (invariants de 30.2, plafond 42), AC14 (conflits internes toujours non resolubles — et STRUCTURELLEMENT INATTEIGNABLES depuis la grille, buildBatchItems n'emettant qu'un seul kind), AC15 (a11y du dialogue — le bloc inline existant n'a ni role, ni piege de focus, ni region live : contre-exemple, pas modele), AC16 (securite : identite de session jamais du corps, union fermee, aucune declaration d'autrui touchee par un Remplacer destructif). QUATORZE PIEGES CONSIGNES, dont : createWithHoles() OUVRE SA PROPRE $transaction (:361, :431) — l'appeler depuis le lot produirait une transaction imbriquee, elle doit accepter un client transactionnel injecte ; create() N'EST PAS ATOMIQUE sur sa branche overwrite (updateMany :115 puis create :133, hors transaction) et n'est donc pas le modele, ce que le code dit lui-meme (:242-243) ; DISASTER N°1 — les deux vues EFFACENT LA SELECTION AVANT LA REPONSE (calendar-month-view.ts:636, calendar-week-view.ts:581), ce qui rendrait impossible de nommer les creneaux et de rejouer le lot, CalendarView doit retenir event.cells ; budget de $transaction (timeout 5 s par defaut en Prisma 7, verifie via Context7) que la decoupe met sous tension sur un lot de 42. QUATRE TESTS EXISTANTS CHANGENT DE VERITE et doivent etre REECRITS, pas supprimes : availability.service.spec.ts:708 et :730 · calendar-view.spec.ts:854 et :878. Aucune migration Prisma attendue (ni champ ni table, comme la story 1.7) — une migration qui apparait est un signal d'erreur de conception. Evaluation SSE faite : aucun cablage nouveau (etat d'interaction local, emission unique deja en place, chaine de rafraichissement inchangee depuis 30.2). Dette NON refermee et rappelee : les cinq items differes de 30.2, dont le TOCTOU (que l'AC7 « lecture unique » interdit de corriger ici) et la boucle sequentielle QU'AGGRAVE LA DECOUPE ; plus ConstraintPanel sans test de composant. Baseline web (commit 74e438c) : 102 fichiers / 1686 tests, lint 143 erreurs pre-existantes, build 1,37 Mo ; baseline API a confirmer au demarrage. SIX QUESTIONS REMONTEES A L'UTILISATEUR : (1) amender AD-21 / ouvrir une AD-22 avant ou apres le code ; (2) valider le parcours « Au cas par cas » tranche sans planche, ou passer par bmad-ux ; (3) divergence lexicale « Ecraser/Garder l'existant » (panneau) vs « Remplacer/Conserver » (contrat) qui coexisteront ; (4) heritee de 36.3, le comportement d'« Autre… » sur une selection de plusieurs jours ; (5) corriger la planche E qui nomme la seance ; (6) rappel /security-review non optionnel + /code-review."

  36-5-les-informations-pratiques-dune-seance:
    status: done
    epic: epic-36
    title: "Les informations pratiques d'une séance"
    last_updated: "2026-08-19"
    note: "REVUE DE CODE (bmad-code-review) le 2026-08-19 : 3 couches paralleles (Blind Hunter, Edge Case Hunter, Acceptance Auditor), 12 constats, 6 patch tous corriges (composeSeanceInfo tronquait par position au lieu de presence ; AC13 — aria-label du rail n'incluait pas les informations pratiques ; DTO PATCH incoherent avec le contrat partage, desormais requis ; garde de brouillon ajoutee contre l'ecrasement par un rafraichissement SSE non lie ; lieu/notePratique acceptaient des chaines uniquement blanches ; heureRdv malformee desormais signalee au MJ au lieu d'etre effacee en silence), 6 rejetes dont 1 faux positif verifie (fuite AC7 alleguee par le Blind Hunter : hunk mal attribue, appartient a buildMySeancesLayer/AC6, pas a getSeanceDerivedUnavailability — AC7 confirme intact). Post-patch : API 59/59 suites, 1287/1287 tests, typecheck 0, lint src/availability 22 = baseline ; web 103/103 fichiers, 1748/1748 tests, lint 143 = baseline. ❌ /SECURITY-REVIEW TOUJOURS DU, non couvert par cette revue de code. IMPLEMENTEE le 2026-08-19 (bmad-dev-story), Tasks 1 a 9, dans la forme AMENDEE de D-15 : TROIS champs sur Seance (heureRdv, lieu, notePratique), tous nullables, migration en trois ADD COLUMN ... TEXT conforme a l'AC12. LA GARDE CENTRALE TIENT ET EST TESTEE : heureRdv est un String?, valide HH:MM au DTO (neuf cas invalides couverts), transmis tel quel par toSeanceDto et buildMySeancesLayer, JAMAIS converti — trois tests l'affirment, dont un not.toBeInstanceOf(Date). LE TYPECHECK A ATTRAPE CE QUE 1284 TESTS VERTS NE VOYAIENT PAS : client Prisma non regenere, ts-jest ne type-verifiant pas en cross-file — c'est le piege n°12 de la story, survenu tel quel. UN SEUL POINT DE COMPOSITION : composeSeanceInfo() sert la bande, le rail, l'agenda et la lecture joueur, et porte seul l'ordre de repli (AC10) ; les trois champs restent SEPARES jusqu'au rendu, sans quoi ce repli serait impossible. Les DEUX chemins d'alimentation sont cables et testes separement (AC6). DETTE REFERMEE : deferred-work.md:9 — le test de non-fuite d'une seance tierce existe desormais, et il est plus fort que prevu (la seance porte les trois champs, l'assertion verifie que RIEN n'en sort, AC7). ✅ VERIFICATION VISUELLE REELLE FAITE — TROIS DEFAUTS TROUVES, tous corriges : (1) dans la bande l'accessoire se reduisait a « 20… », la grille du Mois etant PLAFONNEE A ~896 px et ne grandissant PAS avec la fenetre — la bande demande desormais le niveau MINIMAL, l'heure seule ; (2) l'heure se tronquait ensuite en « 2… », le titre mangeant la place — .band__sub passe en flex:0 0 auto, l'HEURE EST ATOMIQUE et c'est le titre qui prend l'ellipse ; (3) une premiere correction posait un seuil de container query a 1120 px, INATTEIGNABLE — ramene a 712 px. AC11 VERIFIE A L'ECRAN EN LARGEUR TELEPHONE : bande muette, rail toujours porteur du texte complet — sans l'ecart assume a DESIGN.md:373 les informations auraient ete INVISIBLES PARTOUT sur telephone, ce que l'encadre n°4 avait prevu. API 59 suites / 1285 tests (baseline 1248, +37), typecheck 0, lint src/availability 22 = baseline. Web 103 fichiers / 1748 tests (baseline 1714, +34), lint 143 = baseline, build en echec sur le seul budget de bundle pre-existant. ❌ NON VERIFIE A L'OEIL : LA SAISIE MJ — le compte connecte est « Voyageur » sur ses quatre parties et je ne peux pas m'authentifier autrement ; les trois controles et le selecteur d'heure natif ne sont couverts que par 7 tests, A REGARDER AVEC UN COMPTE MJ. ⚠️ ECRITURE DIRECTE EN BASE DE DEVELOPPEMENT SIGNALEE : valeurs de demonstration posees via psql sur la seance du 3 septembre pour verifier le chemin de lecture, TOUJOURS PRESENTES. ❌ RESTE /SECURITY-REVIEW. HISTORIQUE : Story creee le 2026-08-19 (bmad-create-story), trois sous-agents d'exploration. SEULE STORY SERVEUR restante de la premiere moitie de l'epic (D-15) et PREMIERE MIGRATION PRISMA de l'epic 36. CINQ ENCADRES. (1) LA PLACE EST DEJA RESERVEE : les stories 36.1 et 36.2 ont creuse l'emplacement (classe .m du rail, .sub de la bande, quatre champs additifs d'AgendaEntry) et ecrit en toutes lettres qu'elles n'y mettaient rien faute de champ serveur ; le Change Log de 36.1 consigne meme « seul ecart au contrat : les informations pratiques, attendues ». Cette story remplit un trou deja dessine, elle ne redessine rien. (2) ⚠️ L'AC1 DIT « DEPUIS LA CHRONOLOGIE DU SCENARIO » MAIS LA CHRONOLOGIE N'EDITE RIEN : ScenarioTimeline n'affiche qu'une date par seance et ne fait que router (vers ScenarioEditor si MJ, ScenarioReadDialog sinon) ; c'est SeanceList qui porte toutes les actions de seance. Meme forme de constat que la 36.1 (« aucune fenetre de seance n'existe dans l'application »), erigee en regle generale par EXPERIENCE.md:585. « Depuis la chronologie » designe le PARCOURS, pas le composant — ne pas creer de formulaire dans ScenarioTimeline. (3) LE PATRON EXISTE EN ENTIER : compteRendu est deja un texte libre MJ-only porte par Seance — schema (String? sans @db.VarChar), DTO, service (garde parties.getOwned, PAS de guard de route), route PATCH scenarios/seances/:id/..., toSeanceDto, service client, template a template-ref, handler, et tests d'autorisation sont a cloner ligne a ligne. (4) ⚠️ TROUVE EN LISANT LE CSS, ECRIT NULLE PART : la bande masque son texte sous 712 px de grille (calendar-month-view.scss:270) et le rail masque son accessoire .m sous 768 px (calendar-detail-rail.scss:153) — SUR TELEPHONE LES DEUX SE TAISENT EN MEME TEMPS et les informations pratiques ne seraient visibles NULLE PART, alors que le rail est precisement la surface qui compense la case en mobile (AC10 de la 36.2). D'ou l'AC11, et un ⚠️ ECART ASSUME vs DESIGN.md:373 qui range les accessoires parmi ce qui est « replie en premier » — a repercuter par bmad-ux. (5) TROIS TROUS DE SPECIFICATION TRANCHES AVEC LEUR MOTIF (le PRD, epics.md, EXPERIENCE.md, DESIGN.md et le contrat d'UI n'en disent rien) : longueur 200 caracteres ET NON 5000 (le texte part avec CHAQUE charge de calendrier et se rend tronque sur une bande de 20 px ; le contenu attendu fait ~35 caracteres), SAISIE MONO-LIGNE en <input> et non <textarea> (les trois porteurs sont white-space:nowrap, un \n ne peut structurellement pas se rendre — divergence assumee avec le compte rendu), VUE SEMAINE HORS PERIMETRE -> story 36.13 (elle n'affiche aujourd'hui aucun titre de seance, seulement une pastille : poser un accessoire sous un titre inexistant n'a pas de sens ; ce n'est pas une divergence, le contrat decrit l'etat d'arrivee de l'epic). TREIZE AC : les cinq d'epics.md verbatim + AC6 (LES DEUX CHEMINS D'ALIMENTATION, zero appel reseau — le piege rencontre par 36.1 et 36.2 : en contexte de partie le champ est gratuit, en personnel il faut enrichir MyCalendarSeanceEntry ET buildMySeancesLayer, sans quoi il marche a l'essai et manque en production sur profile/calendar), AC7 (JAMAIS DE FUITE dans le calendrier d'une AUTRE partie, AD-9 — « chez Marc, 20 h 30 » est la charge utile la plus indiscrete de l'application ; getSeanceDerivedUnavailability doit rester sans texte), AC8 (le texte suit le TITRE et jamais l'indisponibilite — garantie FR-50, deja protegee par des tests des deux cotes), AC9 (ECHAPPE, JAMAIS INTERPRETE : « rendu tel quel » signifie NON REFORMATE, pas non echappe — XSS stocke potentiel, le champ etant ecrit par le MJ et lu par tous les membres), AC10 (une seule derivation via day-detail.utils.ts, jamais trois mises en forme paralleles), AC11 (atteignable sur telephone), AC12 (migration STRICTEMENT ADDITIVE : un seul champ nullable, une seule ligne SQL attendue), AC13 (annonce au lecteur d'ecran). QUATORZE PIEGES CONSIGNES, dont : chercher un formulaire dans ScenarioTimeline, ecraser AgendaEntry.detail (deja occupe par trois usages), oublier la branche personnelle, laisser le texte fuiter dans getSeanceDerivedUnavailability, faire suivre l'indisponibilite au texte (36.2 a DEJA corrige cette fuite une fois : « text suit desormais winner »), retenir @MaxLength(5000) par mimetisme, ajouter un etat incitatif « Aucune information pratique » (l'AC4 l'interdit — divergence volontaire avec le compte rendu), et COLLER L'ACCESSOIRE AU TITRE AVEC ' · ' ALORS QUE LE TEXTE DE L'UTILISATEUR EMPLOIE DEJA CE SEPARATEUR — defaut exactement attrape par la verification visuelle de la 36.4. Securite : XSS stocke, autorisation getOwned en ecriture / getViewable en lecture, et ⚠️ toSeanceDto n'applique AUCUN filtrage anti-spoil (l'anti-spoil est purement frontend, AD-6) donc le champ sera visible de TOUT membre — c'est voulu, mais doit etre su. Evaluation SSE faite : aucun cablage nouveau, celui de setCompteRendu suffit et se clone ; dette /me/calendar heritee non aggravee. Dette REFERMEE : l'emplacement vide reserve par 36.1/36.2, et possiblement deferred-work.md:9 (aucun test ne couvre l'absence de fuite d'une seance tierce — occasion signalee). Dette AGGRAVEE et consignee sans correction : deferred-work.md:21 (seance.findMany non borne, une colonne texte de plus par ligne chargee). Baseline MESUREE au demarrage (HEAD = 364810c, working tree propre) : API 58 suites / 1248 tests, web 103 fichiers / 1714 tests, tous verts — ⚠️ SUPERIEURS aux chiffres consignes par la 36.4 (1245/1711), un travail etant encore en cours dessus (statut repasse a in-progress). /security-review DU sur cette story (donnees + autorisation) et DEJA EN DETTE depuis la 36.4. ⚠️ AMENDEE LE MEME JOUR PAR correct-course : D-15 PASSE D'UN CHAMP A TROIS (heure de rendez-vous, lieu, note libre). Cinq documents corriges au prealable (sprint-change-proposal-2026-08-19.md) : prd.md FR-50 et D-15, addendum.md 5.7, epics.md AC1-AC4 + notes d'epic, EXPERIENCE.md 4.3 bis. JUSTIFICATION : la demande contredit la LETTRE de D-15 mais respecte son MOTIF — distinction heure-ETIQUETTE (chaine \"20:30\" que rien ne parse, autorisee) vs heure-MODELE (DateTime entrant dans le moteur, toujours interdite) ; six gardes opposables ecrites dans l'addendum, dont la premiere : heureRdv est un String?, JAMAIS un DateTime ni un type time Prisma. Deux preuves recueillies : le rappel de seance par e-mail EXISTE DEJA et ne sait dire que « jeudi 20 aout, soir » faute de donnees ; et le contrat d'UI COMPOSAIT DEJA trois morceaux distincts (lieu et heure sur deux lignes, une seance n'ayant qu'un lieu) — la planche et le PRD etaient deja en desaccord, l'amendement les reconcilie, aucune regeneration necessaire. AUTRES POINTS ARBITRES : bornes lieu 80 / note 200 ; le rail NE REPLIE PAS les informations pratiques sur telephone (⚠️ MODIFIE DESIGN.md:373, a repercuter par bmad-ux) ; saisie MONO-LIGNE confirmee ; et la story 36.4 est SOLDEE (done, /security-review faite), la 36.5 demarrant donc sur une base stable. La vue Semaine reste hors perimetre (-> story 36.13), non rouverte."

