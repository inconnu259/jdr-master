<mat-toolbar color="primary">

  <!-- Ligne 1 : logo + icône compte -->
  <mat-toolbar-row>
    <span class="logo" routerLink="/">master-jdr</span>
    <span class="spacer"></span>

    <button
      mat-icon-button
      [matBadge]="openPollsCount()"
      [matBadgeHidden]="openPollsCount() === 0"
      matBadgeColor="warn"
      matBadgeSize="small"
      [matMenuTriggerFor]="menu"
      aria-label="Menu utilisateur"
    >
      <mat-icon>account_circle</mat-icon>
    </button>
    <mat-menu #menu="matMenu">
      <div class="menu-user">{{ user()?.displayName }}</div>
      <a mat-menu-item routerLink="/parties/new">
        <mat-icon>add</mat-icon>
        <span>{{ theme.tone()['nav.create_game'] }}</span>
      </a>
      <a mat-menu-item routerLink="/account">
        <mat-icon>person</mat-icon>
        <span>{{ theme.tone()['nav.account'] }}</span>
      </a>
      <a mat-menu-item routerLink="/profile/calendar">
        <mat-icon>calendar_month</mat-icon>
        <span>{{ theme.tone()['nav.calendar'] }}</span>
      </a>
      <mat-divider />
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>{{ theme.tone()['nav.logout'] }}</span>
      </button>
    </mat-menu>
  </mat-toolbar-row>


</mat-toolbar>

<main class="content">
  <router-outlet />
</main>
