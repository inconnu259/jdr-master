  30-2-ecriture-groupee-des-disponibilites:
    status: done
    epic: epic-30
    title: "Écriture groupée des disponibilités"
    last_updated: "2026-08-14"
    note: "Story creee le 2026-08-14 (bmad-create-story). Porte FR-32 (volet ecriture groupee, D-14) et AD-21. DEUX CONSTATS D'ANALYSE consignes en encadre en tete de story. (1) AUCUNE SELECTION MULTIPLE N'EXISTE dans l'interface : ConstraintPanel declare un creneau pour une date a la fois, calendar-week-view.ts n'a aucune notion de selection (zero occurrence de `selected`) — cette story livre le CONTRAT (route groupee + transactionnalite + conflits + methode cliente) que la Story 30.3 consommera, elle ne construit aucun ecran de selection. (2) AD-21 SE TROMPE SUR UN POINT DE FAIT : il affirme que AvailabilityService.create() enveloppe deja ses ecritures dans $transaction ; verification faite, $transaction n'existe qu'aux deux branches de createWithHoles() et dans splitOccurrence() — le chemin principal de create() enchaine updateMany() puis doCreate() SANS transaction. create() n'est donc pas le modele d'atomicite a copier, le lot ouvre sa propre transaction. TROIS TROUS COMBLES par des AC supplementaires au-dela des 4 d'epics.md : AC5 conflits INTERNES au lot (le predicat existant ne compare une creation qu'a des lignes PERSISTEES — deux creneaux contradictoires du meme lot ne sont vus par personne et s'ecriraient integralement), AC6 lecture unique des declarations actives (findConflictsForCreate fait un findMany PAR APPEL : l'appeler N fois reproduirait cote serveur le fan-out que le palier combat, NFR-6 — extraire le predicat pur et l'appliquer en memoire, sans jamais dupliquer la logique de conflit), AC7 emission temps reel unique (emitForUser fait lui-meme un findMany, l'appeler 21 fois annulerait le benefice de l'appel unique). GARDE PRINCIPALE (AC8) : interdiction explicite de faire passer ConstraintPanel par la route groupee — celle-ci n'offre PAS overwrite/keep (AD-21 tranche que le lot echoue et que l'utilisateur corrige), et cette unification silencieuse ferait disparaitre le dialogue de resolution + createWithHoles() + tout le mecanisme SPLIT de la Story 1.7. Piege documente : le raisonnement du limiteur de debit invoque par AD-21 et le PRD ne tient pas au chiffre reel (ThrottlerModule ttl 60s / limit 300, app.module.ts:36 — 21 appels ne le declenchent pas) ; les vraies raisons de l'appel unique sont l'atomicite et la latence, ce qui suffit, sans sur-conception. Note de plateforme actualisee : depuis la Story 29.14, @master-jdr/shared est importable au RUNTIME depuis les specs API (transformIgnorePatterns corrige), aucun jest.mock a ajouter. Decisions laissees a l'implementation : plafond du lot (a dimensionner sur le geste de 30.3 et a commenter), forme exacte du 409 groupe (recommandation : conserver { conflicts: ConflictInfo[] } et y ajouter le creneau fautif, pour que le client existant continue de la lire), nom de la methode de service. Baseline : API 54/54 suites 1169 tests, web 96/96 fichiers 1483 tests."

