    note: "Story créée puis implémentée le 2026-08-10/11 (bmad-create-story puis bmad-dev-story), TDD sur les 12 tâches. Backend : User.partiesViewMode/.charactersViewMode/.charactersSort (migration 20260810215107), LIST_VIEW_MODES/CHARACTER_SORTS dans @master-jdr/shared, UpdatePreferencesDto étendu (AccountController/Service déjà génériques, aucune modification). Frontend : character-sort.ts (patron party-sort.ts, Story 29.8), composant partagé ListControlBar (apps/web/src/app/shared/list-control-bar/ — sélecteur de mode 3 icônes sans libellé texte AC2, tri, recherche permanente desktop/repliée mobile via BreakpointObserver, masquage au défilement seuil 48px, repli par défaut derrière une icône migré depuis Dashboard Story 29.8, pastille de résumé icône+libellé). Dashboard et MyCharacters migrés/adoptés vers ListControlBar, filtres rôle/statut projetés en extraFilters pour Dashboard. Ajout d'une recherche par nom sur Dashboard (transitoire, jamais mémorisée), absente jusqu'ici contrairement à l'hypothèse des Dev Notes. Correctifs post-implémentation substantiels (retour utilisateur, avant merge) : les modes d'affichage ne changeaient réellement ni la taille des cartes de parties (seuls grid-template-columns/gap variaient, invisible sur mobile en une colonne) ni le contenu des cartes personnages (seul le gap/la taille d'avatar variait, infos PV/PE/Initiative/Encombrement jugées peu pertinentes sur cette vue et nom écrasé en mode compact). Dashboard : CSS de densité étendu à mat-card-header/title/subtitle/signal-badges par mode, texte redondant de role-indicator/status-indicator masqué en compact (icône+aria-label suffisent). MyCharacters : MyCharacterDto étend classLabel/typeLabel/groupRoleLabel résolus côté serveur (CharacterService.findMine(), contenu de jeu mis en cache + CharacterGroupRole en lot, AD-3, jamais de N+1) ; CharacterSummaryCard gagne typeLabel/groupRoleLabel/showStats (défaut true, préserve tous les sites d'appel existants)/showMjMarker (distinct de showOwnerInfo) + niveau systématiquement affiché ; MyCharacters bascule showStats=false, mode compact réduit à nom+niveau, moyen/grand affichent classe/type/rôle de groupe/repère MJ. Revue de maquette (2026-08-12, retour utilisateur) : le mode liste des deux écrans n'avait aucun gabarit propre (juste des cartes rétrécies), corrigé (gabarit .row Dashboard avec pastille+sous-ligne+compteur unique, MyCharacters/CharacterSummaryCard alignés sur la même grammaire, bulle de montée de niveau repositionnée sur le cercle, mode grand personnages porte désormais les stats). Suite finale : 54/54 suites + 1097/1097 tests API (typecheck propre), 89/89 fichiers + 1273/1273 tests web, lint propre sur tous les fichiers touchés. Build web : échoue uniquement sur le budget de bundle pré-existant (identique 29.4-29.8). Revue de code (bmad-code-review, 2026-08-12, 3 couches Blind Hunter/Edge Case Hunter/Acceptance Auditor) : 20 constats après dédoublonnage, 1 decision-needed résolue par l'utilisateur (seuil symétrique de révélation au défilement conservé), 4 patches appliqués (test de déduplication par système corrigé, lastScrollY initialisé depuis la position réelle, handler resetRequested extrait en méthode nommée, commentaire « vocabulaire disjoint » corrigé), 8 items différés dans deferred-work.md, 7 écartés comme bruit. Suite finale revérifiée : 54/54 suites + 1097/1097 tests API, 89/89 fichiers + 1273/1273 tests web. Statut passé à done."

  29-10-banniere-generative-dune-partie:
    status: done
    epic: epic-29
    last_updated: "2026-08-12"
    title: "Bannière générative d'une partie"
    note: "Implémentée le 2026-08-12 (bmad-dev-story), TDD sur les 8 tâches. 100 % frontend, AC5 vérifiée par git status (0 fichier sous apps/api et packages/shared). party-banner.util.ts : graine FNV-1a 32 bits sur l UUID entier + PRNG mulberry32 explicite, monogramme (articles exclus, repli defensif), regles et bornes de tirage des 3 themes. Deux invariants garantis PAR CONSTRUCTION plutot que verifies apres coup : zone d exclusion du manometre (pushOutOfZone en une seule passe, correction demontrable) et decroissance stricte des tailles de rouages (plancher reservant 4 unites par rouage restant). Tests de propriete sur 500 graines par theme. Composant PartyBanner : un seul SVG par banniere, viewBox 160x88, preserveAspectRatio slice pour le recadrage central du mode moyen — les modes grand et moyen partagent litteralement le meme balisage (AC3 rendu structurel, teste caractere par caractere) ; le mode liste a son propre rendu (vignette degradee + monogramme, aucun SVG). Regle du parametre unique theta de DESIGN.md 8 appliquee des maintenant pour que 29.11 n ait que des keyframes a ajouter. Identifiants SVG scopes par instance (piege non anticipe : une liste rend 12 bannieres, des id fixes les feraient toutes pointer sur les defs de la premiere). Gap de fixture realise comme annonce : le mock ThemeToneService de dashboard.spec.ts n avait pas activeTheme, 62 tests tombes d un coup, corrige. Placeholder .grid--large .tile::before et variable --tile-tint de la Story 29.9 supprimes (code mort). Interpretation consignee : l invariant AC2 « valeurs tirees communes identiques entre themes » est incompatible avec DESIGN.md 7.3 (aucune structure commune entre themes, vocabulaires disjoints) — implemente comme ce qu AD-19 exige reellement, la cle de theme n entre pas dans le tirage, prouve par le premier tirage du flux (dominant) commun aux 3 themes. Suite finale : 91/91 fichiers, 1327/1327 tests web verts, lint propre. Build web : echoue uniquement sur le budget de bundle pre-existant, mesure des deux cotes — 1,25 Mo avant / 1,27 Mo apres, soit +15 kB de geometrie SVG inline. NON VERIFIE VISUELLEMENT (session authentifiee requise) : le rendu a l oeil des 3 themes reste a valider. Story creee le 2026-08-12 (bmad-create-story). 100 % frontend, confirmé par le PRD (section « ne nécessitent aucun changement serveur ») et AD-19 : aucune migration, aucun champ DTO, aucun endpoint — la bannière se recalcule à l'affichage à partir de Partie.id seul. Point de dérivation unique imposé par le Structural Seed : core/parties/party-banner.util.ts (fonctions pures, patron party-sort.ts), plus un composant présentationnel shared/party-banner/ à trois rendus (bannière pleine 78-124 px en grand, vignette carrée 44 px recadrée en moyen, vignette atténuée 28 px + monogramme en liste — rendu spécifique, jamais la bannière réduite). Emplacements déjà réservés par la Story 29.9 (placeholder .grid--large .tile::before à remplacer, slot commenté dans .row à remplir) ; seul le mode moyen demande un ajout structurel. Piège principal consigné en tête de story : DESIGN.md nomme le 3e thème « Atelier Cuivré » mais la clé réelle est toujours medieval-steampunk dans les trois endroits qui la déclarent (shared, tones.ts, styles.scss) — le renommage AD-13/FR-43 et la migration User.theme appartiennent à la Story 35.1, à ne surtout pas anticiper ici. Autres gardes : aucune animation (Story 29.11) mais composition statique déjà complète et comètes construites selon la règle du paramètre unique θ de DESIGN.md §8, pour que 29.11 n'ajoute que des keyframes ; zone d'exclusion du manomètre testée en propriété sur ≥500 graines (intersection de boîtes englobantes, jamais distance entre centres) ; image de couverture non anticipée (Story 29.12, le champ n'existe pas encore). Préséance des maquettes explicitée : DESIGN.md §7.3 > iteration-7-corrections > iteration-6-regles-de-generation, et .working/vignettes-generees.html signalé comme exploration abandonnée. Revue de code (bmad-code-review, 2026-08-12, 3 couches Blind Hunter/Edge Case Hunter/Acceptance Auditor) : 1 decision-needed résolue par l'utilisateur — géométrie rouages/manomètre corrigée (pushOutOfZone() repousse désormais horizontalement, vers le côté opposé au manomètre, canvas 160px bien plus large que la zone d'exclusion ~58-62px, reste dans les limites contrairement au repoussement vertical qui pouvait faire sortir un grand rouage du canvas 88px de haut ; convention de coordonnées des rivets unifiée sur le centre, cohérente avec leur rendu en cercle ; nouveau test de propriété sur 500 graines verrouillant l'absence de disparition hors canvas). 1 patch appliqué (fx/fy du dégradé de fond déplacés du stop vers le radialGradient, en pourcentage — le tirage backgroundFocus n'avait aucun effet visuel jusqu'ici). 9 items différés dans deferred-work.md, 8 écartés comme bruit. Suite finale revérifiée : 91/91 fichiers, 1328/1328 tests web verts (+1 test), lint propre. Statut passé à done."

  29-11-animation-des-bannieres-et-compte-a-rebours:
    status: done
    epic: epic-29
    title: "Animation des bannières et compte à rebours"
    last_updated: "2026-08-12"
    note: "Story creee le 2026-08-12 (bmad-create-story). Deux pieges consignes en encadre en tete de story, tous deux issus d une lecture trop rapide de mockups/palettes-3-pistes-et-rebours-animes.html. (1) LE COMPTE A REBOURS N EST PAS UNE ANIMATION : la boucle de 8 s de la maquette est une demonstration acceleree — sa propre legende dit que la progression reelle est imperceptible a l oeil. Dans l app, le remplissage est une POSITION STATIQUE fonction des jours restants (7 j -> 0, 0 j -> 1). Copier la maquette produirait un tableau de bord qui rejoue son cycle toutes les 8 secondes, exactement ce que DESIGN.md 8 refuse. (2) LES KEYFRAMES DE CETTE MAQUETTE VIOLENT L AC6 : elles animent width, left et box-shadow, alors que l AC6 et DESIGN.md 8 regle 3 n autorisent que transform et opacity — traduction en scaleX/translateX imposee, plus un test de garde dedie (Task 11) qui lit les feuilles de style. Les animations de bannière de iteration-6 sont, elles, deja conformes et font reference. Terrain de la Story 29.10 inventorie champ par champ : speedSeconds/delaySeconds/direction/reverse deja tires pour les 3 themes, aucun nouveau tirage a ajouter — en ajouter un decalerait le flux PRNG et changerait TOUTES les bannieres existantes (violation de l AC2 de 29.10). Les cometes sont deja construites selon la regle du parametre unique theta : il ne reste qu un translateX local dans un g interne (une seule propriete transform par element). AC2 (aucune animation en moyen/liste) se resout par scoping CSS sous :host(.party-banner-host--large), jamais par un @if de template — un test existant compare les compositions grand/moyen caractere par caractere et casserait. AC3 seconde clause deja satisfaite par 29.10 : la composition au repos est complete, prefers-reduced-motion n a rien a restaurer. Limite de jsdom explicitee : aucun test ne peut observer un mouvement, les tests verifient les parametres transmis et la conformite des feuilles de style. Baseline : 91 fichiers / 1328 tests web, build en echec sur le seul budget de bundle pre-existant (1,27 Mo). ELARGIE le 2026-08-12 sur retour utilisateur apres examen de la planche de controle de 29.10, deux ajouts actes : (a) CORRECTION DU RENDU DES BANNIERES en amont de l animation (Tasks 0a-0d). Constat : aucun halo, aucun flou, formes geometriques strictes, elements steampunk trop gros, aucune feuille visible en foret. Cause racine unique trouvee : 29.10 a fixe l espace de dessin a 160x88 tout en reprenant les bornes de iteration-6, dessinees pour une zone d environ 316x124 — tout est rendu a ~2x sa taille relative. Correctif par l espace de dessin (viewBox 320x124, hauteur du mode grand portee a 124 px, autorise par DESIGN.md 4) plutot qu un rabotage borne par borne qui laisserait l erreur en place. Second constat independant : le flou de la maquette (blur 16px sur les halos, 5px/1px sur les cometes, 6px sur la vapeur) n a jamais ete transpose — un halo sans flou est un disque ; deux techniques proposees, degrades radiaux recommandes pour le cout. Troisieme : tous les mobiles de la Foret sont sur la meme ligne horizontale (y = hauteur/2) et la feuille est un rect arrondi la ou la maquette dessine une goutte asymetrique. DEROGATION CONSIGNEE : ces corrections modifient party-banner.util.ts et donc le flux de tirage, toutes les bannieres changent d apparence — acceptable ici et uniquement ici (rien n est persiste, fonctionnalite jamais livree, l AC2 de 29.10 porte sur la stabilite face a un renommage et non sur l immuabilite entre deux versions des regles). Bornee aux Tasks 0a/0c, stricte a nouveau ensuite. (b) AMBIANCE DU COMPTE A REBOURS (Task 7) demandee par l utilisateur : allumage des feuilles par la tige (opacite fonction de progress, pas une animation), scintillement de queue et pulsation de tete pour la comete, oscillation de l aiguille s intensifiant en zone rouge. Toutes en transform/opacity, toutes coupees par reduced-motion, aucune n est le seul porteur d une information. L encadre n1 a ete reecrit : il distingue desormais la PROGRESSION (statique, jours restants) de l AMBIANCE (en boucle, temps), au lieu de dire que le compte a rebours n est pas anime. IMPLEMENTEE le 2026-08-12 (bmad-dev-story), 13 taches. Correction du rendu faite AVANT l animation : espace de dessin porte de 160x88 a 320x124 (correctif a la racine, les positions exprimees en BANNER_VIEWBOX_* ont suivi mecaniquement, seules 3 valeurs en dur reprises et 2 remontees dans BANNER_BOUNDS — ce qui resout gratuitement un item differe de la revue 29.10), hauteur du mode grand a 124 px, densite d etoiles doublee (le ciel etait vide sur un cadre deux fois plus large). Attenuation par DEGRADES et non par filtres (un feGaussianBlur par halo aurait coute cher avec 5 bannieres en mode moyen, pour un resultat identique) ; un unique filtre partage reste pour la queue de comete, qui a besoin d adoucissement perpendiculaire. Queue effilee en path triangulaire, tete avec coeur blanc par degrade. Feuilles : y et rotation ajoutes a ForestMobileParams (tous les mobiles etaient sur la meme ligne), forme passee du rect arrondi a une goutte asymetrique. PIEGE STRUCTUREL RENCONTRE ET CORRIGE : un element SVG ne porte qu une seule propriete transform — la premiere version animait directement la feuille et le pivot d aiguille, qui portaient deja leur placement en attribut, ce qui l aurait efface. Resolu par un <g> intermediaire (externe place, interne anime), avec un test dedie qui verrouille l invariant pour les futures stories. Compte a rebours : fonction pure countdownProgress (now en parametre, jours UTC alignes sur badgeLabel pour ne jamais contredire le libelle affiche a cote), UN SEUL par ecran (la seance la plus proche), instant fige et unique pour tout l ecran, absent du mode liste. Piege evite : @if (x; as y) aurait masque progress === 0 (exactement 7 jours), 0 etant falsy. Ambiance implementee telle que demandee : allumage des feuilles par la tige (opacite fonction de progress + transition, pas une boucle), scintillement de queue et pulsation de tete, defilement du motif A L INTERIEUR de la conduite jamais de sa longueur, oscillation de l aiguille d amplitude triplee en zone rouge via une propriete personnalisee dans les keyframes. TEST DE GARDE AC6 : party-banner-motion.spec.ts lit les feuilles de style et verifie que chaque keyframes n anime que transform/opacity et que chaque feuille declare une coupure prefers-reduced-motion ; l extraction apparie les accolades et le test se verifie lui-meme sur les keyframes reelles de la maquette, sans quoi un bug d extraction rendrait tout vacuement vert. 2 tests de 29.10 mis a jour legitimement (viewBox, forme de la queue). Suite finale : 94/94 fichiers, 1368/1368 tests web verts, lint propre. Build : echoue uniquement sur le budget pre-existant, 1,27 -> 1,28 Mo (+10 kB). NON VERIFIE VISUELLEMENT, et plus lourdement que d habitude : jsdom ne calcule aucune animation, aucun test n a observe un seul mouvement. Une planche de controle (12 parties x 3 themes x 3 modes + comptes a rebours a 5 echeances, vrai composant, animations reelles) a ete generee et doit etre validee — y compris avec la reduction des animations activee. Retravail post-QA visuelle (retour utilisateur) : comptes a rebours Foret et Grimoire retravailles (queue de comete devenue la barre de progression, mouvement interne des deux barres, signal d approche generalise aux 3 themes doublant une info deja portee). Revue de code (bmad-code-review, 2026-08-12, 3 couches Blind Hunter/Edge Case Hunter/Acceptance Auditor) : 0 decision-needed, 5 patches appliques — AC5 violee (compte a rebours pouvait s afficher sans badge PROCHAINE_SEANCE_CONNUE visible, plafond de 2 badges pouvait l evincer), AC2 violee (PartyCountdown n avait aucune classe d hote par mode, animait aussi en mode moyen), seance passee non purgee pouvait confisquer indefiniment le compte a rebours (interaction avec un item deja differe de la revue 29.7), test de garde AC6 durci contre le CWD du test-runner, test structurel etendu a la feuille et l aiguille (les elements ayant reellement declenche le piege une seule propriete transform). 7 items differes dans deferred-work.md, 7 ecartes comme bruit. Suite finale revérifiée : 94/94 fichiers, 1377/1377 tests web verts, lint propre. Statut passe a done."

  29-12-image-de-couverture-de-partie:
    status: done
    epic: epic-29
    title: "Image de couverture de partie"
    last_updated: "2026-08-13"
    note: "Story creee le 2026-08-12 (bmad-create-story). CETTE STORY EST D ABORD UN REFACTOR DE SECURITE, ensuite une fonctionnalite : AC5/AC7 portent sur la validation MIME par octets magiques et le nettoyage EXIF, qui sont des mecanismes de securite. Trois chemins d upload existent deja (portraits, documents de scenario, et la couverture a creer) — l ordre de travail extraire-d-abord est pose en tete de story, car ecrire le controleur de couverture avant l extraction creerait le quatrieme chemin parallele qu AD-17 existe pour empecher. DANGER PRINCIPAL identifie et traduit en exigence executable : character.service.spec.ts:48 fait jest.mock(./image-mime.util) — si le chemin change, le mock ne s applique plus a rien et LE TEST CONTINUE DE PASSER en testant le vrai sharp. AC7 (aucun test ne passe silencieusement a cote de son sujet) exige donc un test qui echouerait si le mock n etait plus applique. Second consommateur, ryuutama-pdf.service.ts:30, casse bruyamment (faible risque). Verifications faites avant ecriture : sharp ^0.35.3 est DEJA une dependance de l API — l AC9 (derivees dimensionnees) n est donc pas un blocage necessitant une approbation de dependance ; les gardes getOwned()/getViewable() existent deja dans PartiesService (lignes 199 et 207), aucune garde a ecrire pour l AC4 ; le commentaire « JAMAIS incluse dans PartieDto » du Structural Seed porte sur sheetVisibility et NON sur coverImageUrl (verifie par lecture du bloc complet). Deux cas d usage manques rattrapes en relecture checklist, dans la lignee de ce que les revues de 29.10 et 29.11 avaient trouve : (1) CACHE-BUSTING — l AC9 impose des en-tetes de cache alors que l URL d une couverture est stable ; sans jeton de version, un remplacement d image n apparaitrait JAMAIS a l ecran alors que base, disque et tests serveur sont tous corrects. La recommandation de projection dans PartieDto a ete revue en consequence : un jeton coverImageVersion (l uuid du fichier, neuf a chaque depot) plutot qu un booleen — un seul champ qui sert d indicateur de presence ET de cache-busting, sans fuite de chemin de stockage. (2) TEMPS REEL — depot et retrait doivent emettre l evenement (AD-14), sinon les autres membres voient l ancienne identite visuelle jusqu a un rechargement complet ; PartiesService porte deja les patrons emit(partieTopic) et emitPartieAndMembers. Ajoute aussi : repli obligatoire sur la banniere generee si le fichier a disparu du disque (CAP-20 : aucune partie n est jamais nue, donc jamais d image cassee). Gardes posees : plafond 5 Mo REDECLARE deux fois et jamais factorise (AC6, il vit dans des decorateurs), jamais de service statique (AC8), mode valide contre une union fermee et jamais une largeur arbitraire du client (vecteur de deni de service par redimensionnement), bannerParams() strictement intouche (la derogation de 29.11 est close). Hors perimetre explicite : refonte des ecrans de creation/edition (29.14, perimetre non arrete), politique de retention des images remplacees (question ouverte a traiter une fois pour portraits ET couvertures), unification du chemin des documents de scenario, recadrage choisi par le MJ. Baseline : 94 fichiers / 1377 tests web, build en echec sur le seul budget de bundle pre-existant (1,28 Mo). Piege de plateforme rappele : ajouter un champ a PartieDto casse les fixtures de test web (jusqu a 62 tests d un coup en 29.10), et ts-jest ne type-verifie pas cross-fichier — lancer pnpm typecheck apres ce refactor qui deplace des exports. DECISION TRANCHEE avec l utilisateur le 2026-08-12 : les DERIVEES sont en WebP quel que soit le format depose, l ORIGINAL reste dans son format de depot. Motif principal : cela SIMPLIFIE (nom de derivee deterministe <uuid>-<mode>.webp et Content-Type constant, au lieu de suivre 3 tailles x 3 formats avec un Content-Type a deduire a la lecture), en plus de servir l AC9 qui est la seule AC quantitative de la story. Point de vigilance consigne : ne rien changer au comportement de stripImageMetadata(), qui preserve delibererement le format d entree parce qu il traite le fichier de l utilisateur — c est le chemin de securite de l AC5. Le gain reel est a mesurer sur une image representative, pas a supposer. IMPLEMENTEE le 2026-08-13 (bmad-dev-story), 11 taches en TDD. Tasks 1-2 (refactor de securite) faites en premier : image-mime.util.ts/portrait-storage.util.ts SUPPRIMES (decision retenue : suppression plutot que re-export), fonctions deplacees dans common/image-upload.util.ts parametre par domaine, ecriture disque remontee. readPortraitFile()/extractPortraitFilename() restent au domaine personnage (character.service.ts), ryuutama-pdf.service.ts importe depuis la. Test AC7 dedie ajoute (valeur mockee de stripImageMetadata impossible a produire par un vrai sharp(), preuve que le jest.mock cible encore le bon module). Task 3 : Partie.coverImageUrl seul champ ajoute (migration appliquee, conteneur redemarre), PartieDto.coverImageVersion projete (stem UUID derive, jamais le chemin). Tasks 4-5 : PartyCoverController (PUT/GET/DELETE /parties/:id/cover), PartiesService etendu (setCoverImage/removeCoverImage/getCoverFile), 3 derivees WebP pre-generees par mode (640x248/88x88/56x56, x2 densite d ecran), cache immuable + ETag + cache-busting par jeton de version en query param. Mesure manuelle du gain WebP consignee (derivee large ~21x plus legere qu un JPEG source simule de 1,37 Mo). Tasks 6-7 : PartyBanner gagne coverImageVersion (composition generee jamais rendue si une image est presente, repli sur echec de chargement via effect() reinitialisant le signal a chaque changement de version), Dashboard cable sur les 3 appels, ecran d edition (partie-form) etendu pour deposer/retirer l image independamment du formulaire principal (recadrage automatique cote serveur, pas de reprise de PortraitCropper). Suite finale : API 54/54 suites (1120/1120 tests, +23 vs baseline), typecheck propre ; Web 94/94 fichiers (1389/1389 tests, +12 vs baseline), lint propre (warnings no-unsafe-* sur mocks Prisma/app.getHttpServer() : convention deja etablie, non introduite). NON VERIFIE VISUELLEMENT (session authentifiee requise) : le rendu reel de l image recadree dans les trois modes reste a valider a l oeil. Revue de code (bmad-code-review, 2026-08-13, 3 couches Blind Hunter/Edge Case Hunter/Acceptance Auditor) : 0 decision-needed, 5 patches appliques — fuite du Cache-Control immuable sur les reponses 404 (scenario CAP-20 fichier disparu du disque, corrige en deplacant l en-tete dans la seule branche de succes), deduplication de coverStem()/coverImageVersion(), calcul mort supprime dans getCoverFile(), garde anti-double-clic ajoutee sur le depot/retrait de couverture (absence de verrou optimiste cote serveur, Partie n ayant pas de champ updatedAt), indentation corrigee dans deux fixtures. 7 items differes dans deferred-work.md, 6 ecartes comme bruit. Suite finale revérifiée : API 54/54 suites (1121/1121 tests), Web 94/94 fichiers (1391/1391 tests), lint et typecheck propres. Statut passe a done."

  29-13-annonces-non-vues-signalees-a-la-connexion:
    status: done
    epic: epic-29
    title: "Annonces non vues signalées à la connexion"
    last_updated: "2026-08-13"
    note: "Story créée le 2026-08-13 (bmad-create-story). CAP-6/FR-13. Purement additive : AnnouncementsService/Controller/AnnonceCard et l'emplacement de consultation existant (PartieDetail, écrans de scénario) ne changent pas (AC4) — la story ajoute un état « vue » par utilisateur/annonce par-dessus. Structural Seed nomme déjà le modèle AnnouncementRead(userId, announcementId) (AD-1, relationnel — jamais un timestamp scalaire, qui ne pourrait pas distinguer vue dans une Partie de non-vue dans une autre, exactement ce qu'AC3 vérifie). Trou d'agrégation déjà documenté par la revue adversariale du PRD (M-3) : AnnouncementsController est scopé à une Partie, aucune lecture transverse — corrigé par un filtre relationnel Prisma en un seul appel (reads: { none: { userId } } combiné à un OR mjId/memberships), jamais un fan-out par Partie comme le fait déjà OpenPollsService (anti-patron documenté par M-4, explicitement à ne pas reproduire). AD-4 : l'état vit dans AccountService/AccountController (patron addFavorite()/PUT /me/favorites/:partieId exact), pas dans AnnouncementsService — AccountController n'a aujourd'hui aucune route GET, cette story introduit la première. AD-14 exclut explicitement le SSE pour cet état personnel : rafraîchi localement, jamais un canal user:{id} dédié. Côté front, deux chemins font passer currentUser de null à un utilisateur (login() et fetchSession(), restauration de session) — AC3 (session déjà ouverte sur un second appareil) exige de couvrir les deux. AnnonceCard n'a aucune interaction de clic aujourd'hui : « ouvrir une annonce » est tranché comme son affichage à l'écran, pas un nouveau bouton. Décisions laissées à l'implémentation : forme exacte de la notification (badge Shell recommandé, patron openPollsCount déjà en place, MatBadgeModule déjà importé — mais jamais MatSnackBar, dont le tir à durée fixe contredirait AC2 qui veut une disparition pilotée par l'état, pas un minuteur), cible du badge, granularité du marquage (en lot par Partie recommandé, pas un appel par annonce). Baseline : API 54/54 suites (1121/1121 tests), Web 94/94 fichiers (1391/1391 tests). IMPLÉMENTÉE le 2026-08-13 (bmad-dev-story), 9 tâches en TDD. Backend : modèle AnnouncementRead ajouté (migration 20260812233502_announcement_read), toDto() exporté depuis AnnouncementsService et réutilisé sans duplication (AD-17), AccountService.getUnseenAnnouncements() en un seul findMany (filtre relationnel reads:none + partie OR mjId/memberships), markAnnouncementRead() idempotent en miroir exact d'addFavorite() (P2002 avalé, P2003 -> NotFoundException), 2 routes AccountController (GET /me/unseen-announcements, PUT /me/announcements-read/:id). Piège rencontré et corrigé : AccountService important transitivement @master-jdr/game-rules (ESM) via toDto() -> CharacterService, cassant account.service.spec.ts/account.controller.spec.ts sans le mock jest.mock('@master-jdr/game-rules') déjà en place ailleurs dans le projet — ajouté aux deux fichiers. Frontend : UnseenAnnouncementsService (nouveau, providedIn root) détecte la transition currentUser() null->utilisateur (garde wasLoggedIn, couvre login() ET fetchSession(), jamais SSE par AD-14), markRead() retire localement sans refetch. DÉCISION Task 7 (documentée dans Completion Notes) : badge combiné dans Shell additionnant openPollsCount()+unseenAnnouncementsCount() dans un seul matBadge sur la destination Parties, plutôt qu'une 5e destination ou une bannière séparée — description accessible construite dynamiquement, jamais la seule couleur. Task 8 : marquage « vue » câblé via un effect() auto-convergent (pas de garde firstRun nécessaire, l'id disparaît du set une fois marqué) dans PartieDetail (campaignAnnouncements), ScenarioEditor et ScenarioReadDialog (scenarioAnnouncements, respectant isRestricted()+canSeeAnnouncements() du template pour ne jamais marquer une annonce non affichée, AC6 anti-spoil). Suite finale : API 54/54 suites (1133/1133 tests), typecheck propre ; Web 95/95 fichiers (1409/1409 tests) ; lint vérifié sur tous les fichiers touchés, aucune nouvelle dette introduite (erreurs no-unsafe-*/prettier relevées préexistent sur du code non touché). Statut passé à review."

  29-14-refonte-des-ecrans-de-creation-et-dedition-de-partie:
    status: done
    epic: epic-29
    title: "Refonte des écrans de création et d'édition de partie"
    last_updated: "2026-08-14"
    note: "Porte Q-1, retenue dans le palier 9 le 2026-08-05. Story créée le 2026-08-13 (bmad-create-story). Q-1 ARBITRÉE avec l'utilisateur au démarrage, comme l'exigeaient le SPEC, le PRD et la spine : périmètre « Mise en forme + parcours » (hiérarchie mobile-first des deux écrans, même grammaire création/édition, dépôt de couverture possible dès la création, libellés thématisés) + les 3 items différés de la revue 29.12 (indicateur de chargement du dépôt, validation cliente taille/type, erreurs véridiques NFR-4). Rapatriement des actions de gestion (Clôturer/Rouvrir/Supprimer, invitations) ÉCARTÉ pour recouvrement avec l'épic 32 (32.1/32.2 refont ce terrain). CETTE STORY EST D'ABORD UNE GARDE DE DONNÉES, ensuite une refonte visuelle : trou trouvé en analyse et signalé explicitement à l'utilisateur (NFR-5), qui a autorisé le changement serveur — PartiesService.update() fait `data: { ...dto }` et UpdatePartieDto accepte les 3 PartieKind, donc les 6 transitions de type passent sans aucune vérification ni réparation, alors que le kind gouverne des invariants dans 4 services. Trois transitions produisent un état que le code déclare impossible, dont une IRRÉCUPÉRABLE par l'interface (campagne sans scénario convertie en one-shot : ScenariosService.create() refuse d'en créer un, la création auto n'ayant lieu qu'à PartiesService.create()). Matrice des 6 transitions arrêtée puis AMENDÉE par l'utilisateur sur 3 points : (a) cas 3 et 5 (→ ONE_SHOT) — à 0 scénario on en CRÉE un (titre = nom de la partie, BROUILLON + séance, patron PartiesService.create()) au lieu de refuser, refus conservé seulement à partir de 2 scénarios ; (b) cas 6 (EPISODIQUE → LINEAIRE) — autorisée même à plusieurs COURANT, le MJ désignant celui qui reste Courant, les autres repassant A_VENIR avec séances/votes/dates intacts, au lieu d'un refus. Question de l'utilisateur « un scénario futur peut-il être daté ? » vérifiée dans le code et non à l'estime : seul le statut PASSE bloque addSeance() (scenarios.service.ts:466) et createSeancePoll() (:616), et le schéma décrit A_VENIR comme « titre+date seuls » — aucun problème de spec, l'organisation prévisionnelle est déjà supportée. 3 règles transverses : (A) rien n'est jamais effacé, les ScenarioParticipant/Inscription/capacités restent dormants en quittant l'épisodique (comportement actuel, rend la conversion réversible), le semis des cas 2/4 étant un upsert idempotent ; (B) le serveur est l'autorité et le formulaire l'écho, tous deux consommant LA MÊME fonction pure de @master-jdr/shared — jamais deux tables de règles (AD-17) ; (C) aucune conversion sur une partie clôturée. Réparation des cas 2/4 (semis des membres actuels comme participants) fondée sur un commentaire existant du code et non sur une supposition : homme-dragon.service.ts:378-379 écrit que pour ONE_SHOT/CAMPAGNE_LINEAIRE « tous les membres actuels sont réputés participer ». Décision d'architecture tranchée dans la story : route dédiée PATCH /parties/:id/kind plutôt qu'un élargissement d'UpdatePartieDto (la conversion est une opération à effets avec un paramètre transitoire courantScenarioId, pas une édition de champ) ; update() rejette un kind DIFFÉRENT mais reste tolérant à un kind identique, sans quoi le formulaire et partie-form.spec.ts:91 cassent. Pièges consignés : ne pas injecter ScenariosService dans PartiesService (cycle — ScenariosService injecte déjà PartiesService, la conversion lit Scenario via prisma comme le fait déjà hasScenario()) ; la transition COURANT → A_VENIR n'existe nulle part et reste INTERNE à la transaction, aucune route « démarquer » (l'épic 32 refait la chronologie) ; le refus doit précéder toute écriture (AC10) ; bannerParams() strictement intouché (dérogation 29.11 close depuis 29.12) ; 3ᵉ thème toujours nommé medieval-steampunk, renommage réservé à 35.1. Aucun champ Prisma ajouté ni retiré. Baseline : API 54/54 suites (1133/1133 tests), Web 95/95 fichiers (1409/1409 tests) ; build web en échec sur le seul budget de bundle pré-existant (~1,28 Mo, constant depuis 29.4)."

