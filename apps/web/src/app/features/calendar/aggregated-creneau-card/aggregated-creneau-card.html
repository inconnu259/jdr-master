<article class="agg-card" [class]="priorityClass()">
  <header class="agg-card__header">
    <span class="agg-card__date">{{ formatDate(slot().date) }}</span>
    <span class="agg-card__slot">{{ slotLabel() }}</span>
  </header>
  <div class="agg-card__counts" [attr.aria-label]="theme.tone()['calendar.agg_counts_aria']">
    <span [title]="theme.tone()['calendar.agg_available_title']">✅ {{ slot().available }}</span>
    <span [title]="theme.tone()['calendar.agg_unknown_title']">⚠️ {{ slot().unknown }}</span>
    @if (slot().unavailable > 0) {
      <span [title]="theme.tone()['calendar.agg_unavailable_title']"
        >❌ {{ slot().unavailable }}</span
      >
    }
    <span class="agg-card__total">/ {{ slot().total }}</span>
  </div>
</article>
