    review_note: "REVUE DE CODE (bmad-code-review) le 2026-08-22 : 3 couches paralleles (Blind Hunter, Edge Case Hunter, Acceptance Auditor), 1 decision + 3 patch tous corriges. Decision utilisateur : la cle de reconciliation de setOptions() (date normalisee ISO) n'etait PAS litteralement identique a celle de dedoublonnage de create() (chaine brute), contrairement a ce qu'affirmaient le commentaire et les Dev Notes de l'encadre n4, sur le chemin d'ecriture destructrice le plus sensible de la story (suppression en cascade de PollVote) — choix : harmoniser create() sur la meme fonction optionKey() normalisee plutot que de seulement corriger la documentation ; nouveau test de regression prouvant qu'un doublon date/heure-differente-meme-instant est desormais refuse. Patches : champ mort composeInitialKeys retire de CalendarView (ecrit mais jamais lu, calcul reel deja base sur composedPollEntry()) ; fenetre TOCTOU sur le chiffre de l'avertissement AC6 fermee (voterCount reverifie juste avant l'ecriture reseau, pas seulement avant l'ouverture du dialogue — refuse d'ecrire silencieusement si le compte a augmente depuis) ; garde nulle ajoutee apres la relecture post-transaction de setOptions() (symetrique de la garde initiale, inatteignable en pratique mais nouveau motif dans ce fichier). Post-patch : API 60/1317 (+1), typecheck propre ; web 110/2001 (baseline identique), typecheck propre. ⚠️ /security-review reste NON OPTIONNEL sur cet epic et TOUJOURS DU (dette depuis la 36.4, et cette story est celle qui le motive le plus — premiere ecriture destructrice de donnees d'autrui du calendrier)."
