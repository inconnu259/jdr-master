@if (mode() === 'joint') {
  <span class="identity-label identity-label--joint">
    <span class="identity-label__character">{{ characterName() }}</span>
    <span class="identity-label__player">{{ playerName() }}</span>
  </span>
} @else if (mode() === 'single-character') {
  <span class="identity-label identity-label--single" [attr.aria-label]="singleAriaLabel()">
    <app-icon class="identity-label__icon" [name]="characterIcon" />
    <span class="identity-label__name">{{ characterName() }}</span>
  </span>
} @else if (mode() === 'single-player') {
  <span class="identity-label identity-label--single" [attr.aria-label]="singleAriaLabel()">
    <app-icon class="identity-label__icon" [name]="playerIcon" />
    <span class="identity-label__name">{{ playerName() }}</span>
    @if (ambiguous() && pseudo()) {
      <span class="identity-label__pseudo">({{ pseudo() }})</span>
    }
  </span>
}
