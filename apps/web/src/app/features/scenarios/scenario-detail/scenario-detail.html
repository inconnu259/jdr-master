@if (partieId) {
  <a mat-button class="scenario-detail__back" [routerLink]="['/parties', partieId]">
    <app-icon name="retour" /> {{ theme.tone()['common.retour_a_la_partie'] }}
  </a>
}
@if (loading()) {
  <p>{{ theme.tone()['common.chargement'] }}</p>
} @else if (loadError()) {
  <p class="error">{{ loadError() }}</p>
} @else if (scenario(); as s) {
  <app-scenario-editor [scenario]="s" />
}
