    title: "Écran de compte et nom affiché"
    note: "Story créée le 2026-08-05 (bmad-create-story). Première story du Palier 9. Ouvre deux fondations : le module account côté API (AD-4) et User.displayName (AD-1). Piège principal : la migration NOT NULL sur table peuplée, dont le SQL exact est écrit dans la story (ADD nullable → UPDATE = pseudo → SET NOT NULL). Périmètre volontairement resserré : pas de GET /me (auth/me suffit), pas de section Préférences (aucune n'existe encore), AD-2 réservé à la story 28.2. Implémentée le 2026-08-05 (bmad-dev-story) : 7 tasks en TDD. 2 appelants Prisma supplémentaires non anticipés corrigés pour le typecheck API (seed-demo.ts, seed-admin.ts) ; ng test s'est avéré type-checker les specs web, révélant 2 fixtures AuthUser obsolètes (auth.guard.spec.ts, auth.service.spec.ts). Revue de code le 2026-08-05 (3 couches adversariales) : 0 decision-needed, 6 patches appliqués (trim/rejet des noms composés uniquement d'espaces API+front, P2025 catché dans AccountService → 404 propre, libellé dupliqué entre thèmes reformulé, label E-mail câblé sur theme.tone(), test de la branche formulaire invalide ajouté, commentaire de migration obsolète nettoyé), 2 items différés (voir deferred-work.md), 8 écartés (dont 1 faux positif de l'Acceptance Auditor sur account.scss, vérifié présent). Suite finale : 938/938 tests API, 1027/1027 tests web, typecheck API propre, redémarrage réel du conteneur confirmé, vérification manuelle bout-en-bout réelle (curl) validant les 4 AC + le trim + le rejet des espaces seuls. Statut passé à done."

