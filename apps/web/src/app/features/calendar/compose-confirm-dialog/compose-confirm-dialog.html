<h2 mat-dialog-title>{{ title() }}</h2>

<mat-dialog-content>
  <p class="compose-confirm__summary">{{ summary() }}</p>

  @if (data.voterCount > 0) {
    <!-- AC6 : l'avertissement précède l'écriture et NOMME le nombre de réponses supprimées. -->
    <p class="compose-confirm__warning" role="alert">{{ warning() }}</p>
    <!-- Story 47.4 : une durée changée n'épargne aucune réponse — la note « les créneaux gardés gardent leurs
         réponses » serait fausse. -->
    @if (!data.durationChanged) {
      <p class="compose-confirm__note">
        {{ note() }}
      </p>
    }
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">
    {{ theme.tone()['common.renoncer'] }}
  </button>
  <button
    mat-flat-button
    type="button"
    [color]="data.voterCount > 0 ? 'warn' : 'primary'"
    (click)="confirm()"
  >
    {{ theme.tone()['common.enregistrer'] }}
  </button>
</mat-dialog-actions>
