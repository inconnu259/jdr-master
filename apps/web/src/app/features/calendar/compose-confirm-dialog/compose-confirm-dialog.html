<h2 mat-dialog-title>
  @if (data.mode === 'new') {
    {{ theme.tone()['common.lancer_le_vote'] }}
  } @else {
    {{ theme.tone()['calendar.compose_confirm_title_modify'] }}
  }
</h2>

<mat-dialog-content>
  <p class="compose-confirm__summary">{{ summary() }}</p>

  @if (data.mode === 'new') {
    <!-- AC11 : un vote appartient TOUJOURS à une séance. La question est posée ici, après la
         désignation des créneaux, et non plus dans un sélecteur en marge du calendrier (AC9). -->
    <label class="compose-confirm__field">
      {{ theme.tone()['calendar.compose_confirm_seance_label'] }}
      <select
        class="compose-confirm__select"
        [value]="seanceId() ?? ''"
        (change)="onSeanceChange($event)"
      >
        <option value="">
          {{ theme.tone()['calendar.compose_confirm_seance_placeholder'] }}
        </option>
        @for (s of data.seances; track s.seanceId) {
          <option [value]="s.seanceId">{{ s.label }}</option>
        }
      </select>
    </label>
  } @else if (data.voterCount > 0) {
    <!-- AC6 : l'avertissement précède l'écriture et NOMME le nombre de réponses supprimées. -->
    <p class="compose-confirm__warning" role="alert">{{ warning() }}</p>
    <p class="compose-confirm__note">
      {{ theme.tone()['calendar.compose_confirm_note'] }}
    </p>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">
    {{ theme.tone()['common.renoncer'] }}
  </button>
  <button
    mat-flat-button
    type="button"
    [color]="data.mode === 'poll' && data.voterCount > 0 ? 'warn' : 'primary'"
    [disabled]="!canConfirm()"
    (click)="confirm()"
  >
    @if (data.mode === 'new') {
      {{ theme.tone()['common.lancer_le_vote'] }}
    } @else {
      {{ theme.tone()['common.enregistrer'] }}
    }
  </button>
</mat-dialog-actions>
