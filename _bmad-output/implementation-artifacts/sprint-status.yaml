    implementation_note: "Implementee le 2026-08-22 (bmad-dev-story). 🚨 LE DEFAUT QUE SEULE LA VERIFICATION VISUELLE A VU N ETAIT PAS DANS LE CODE : au premier passage dans Chrome le rail affichait la jauge anonyme et « 2 / 2 » la ou un MJ doit voir des noms — tout le front etait juste, mais le conteneur API tournait depuis 9h24 alors que le diff datait de 10h45 (le watcher nest start --watch ne l avait pas repris, montage de volume Windows). docker compose restart api a tout fait apparaitre. AUCUN test ne pouvait le voir : les 1303 tests API tournent sur le source, pas sur le processus qui sert. A RETENIR pour toute story touchant apps/api. TROIS EFFETS NON PREVUS PAR LA STORY : (1) ajouter members? a AggregatedSlotDto CASSE le discriminant historique « members in s » employe a quatre endroits pour separer vue MJ et vue joueur — attrape par le COMPILATEUR, pas par un test ; remplace par isNamedSlot() qui discrimine sur l ABSENCE d agregats, qu un champ facultatif ne peut plus rendre ambigu, verrouille par 3 tests dont un qui passe la forme « agregats + identites » exacte que sert desormais le heatmap ; (2) .band et .slot-cell portent leur propre aria-label, qui ECRASE le nom accessible d app-group-gauge — meme piege que la revue de la 36.7 avait corrige pour la piste dans le rail, retrouve intact une story plus tard, replie dans bandAriaLabel()/cellAriaLabel() ; (3) resolveParticipants() n avait AUCUN orderBy — ecart silencieux jusqu ici, mais l AC4 (« la position identifie la personne ») en depend entierement. LE CANAL NE SUIT PAS LE RANG GAGNANT : dans calendar-month-view.ts, text/info/vote sont chacun gardes par winner === … sur trois lignes consecutives et group vient juste apres SANS garde — c est l AC2 tout entier, et le geste naturel en relisant le bloc est d ajouter la garde manquante, d ou trois commentaires 🚨. Le continue de calendar-view.ts etait la MOITIE CACHEE DE L AC6 : il sautait les creneaux « aucun dispo et aucun avis », donc la grille ne pouvait structurellement pas montrer ce vide ; retire, filtre passe a l affichage de l Agenda. VERIFICATION VISUELLE REELLE FAITE dans Chrome (session de test utilisateur, partie « Les Veilleurs du Pont », mode MJ) : AC2 mesure sur la grille reelle — 126 bandes sur 126 portent le canal (seance 1/1, available 27/27, unavailable 18/18, none 80/80) ; AC10 couche eteinte = 0 canal, 0 marge residuelle, fusion revenue (44 bandes / 41 fusionnees contre 126) ; AC11 trois bandes et six pastilles partout ; AC13 cinq semaines en avant hors grille d aout = 21/21 cellules portent encore le canal (0 sans le correctif) ; AC12 PROUVE PAR UN HIT-TEST REEL (elementFromPoint au centre d une pastille renvoie .slot-cell, pas la jauge — en jsdom ce hit-test est stubbe, l assertion n y a aucune valeur) ; case etroite = libelle a 40,6 px pour 69 px de texte, IDENTIQUE couche allumee et eteinte, donc le canal ne coute aucune largeur. NON VU A L OEIL, et ecrit comme tel : les deux vides cote a cote et la VUE JOUEUR (jauge anonyme) — le compte de test est MJ d une seule partie a 2 membres, donc toujours en pastilles ; couverts par 6 tests, la revue de securite et la garde isMj tracee, mais pas vus. /security-review LANCEE ET PROPRE (aucune HIGH ni MEDIUM ; la seule surface nouvelle est gardee par le isMj existant, derive de partie.mjId et de l identifiant de SESSION, jamais d un parametre de requete ; cle OMISE pour un joueur, jamais []) — dette de /security-review ouverte depuis la 36.4 REFERMEE. API 60 suites / 1303 tests (baseline 1300), web 108 fichiers / 1932 tests (baseline 106/1859), lint web 143 = baseline (monte a 149, ramene), typecheck API propre, AUCUNE migration. 7 entrees consignees dans deferred-work.md. Reste : /code-review (de preference un autre modele), et 3 questions ouvertes a l utilisateur — perimetre serveur, arbitrage AC7/AC3, marge de 11 px."
    note: "Story creee le 2026-08-22 (bmad-create-story), exploration menee en direct (pas de sous-agents). NEUF ENCADRES. (1) ⚠️ LA STORY N'EST PAS FRONT PURE, contrairement a epics.md:1924 : l'AC4 (une marque par membre pour le MJ, sur la grille) exige une donnee que le serveur ne sert pas — getHeatmap n'expose que des compteurs, getAvailableSlots expose bien des membres au MJ mais exclut en dur les creneaux ou le MJ est UNAVAILABLE, tronque a 20 entrees et suit la plage du formulaire, pas la grille ; et resolveParticipants() fait membership.findMany SANS orderBy, donc « la position identifie la personne » est faux par intermittence. Option A retenue : members? optionnel sur AggregatedSlotDto servi au seul MJ sous la garde isMj DEJA presente, + orderBy joinedAt asc — ~15 lignes, un seul fichier serveur, AUCUNE migration. La planche affirme « le serveur le fait deja » (contrat-ui:465) : c'est a moitie vrai, et c'est le piege n°1. (2) LE CANAL N'EST PAS UN RANG — day-detail.utils.ts:44 porte deja l'interdiction ecrite POUR cette story ; group est un champ FRERE de winner, rendu quel que soit le gagnant, contrairement a text/info/vote qui le suivent : c'est exactement l'AC2 et le piege de copie le plus probable. (3) LA COUCHE ALLUMEE INTERDIT LA FUSION DES BANDES — bandsAreUniform() a ete ecrite en prevision (:257-260, elle nomme la 36.8) et la condition se pose AU POINT D'APPEL ; la planche le prouve independamment (uni(day)&&!g&&!mjm). (4) TROIS ETATS DE JAUGE, pas deux : la planche declare .gauge.blocked en CSS mais ne l'emet JAMAIS — la prose gagne ; le cas ambigu available=0 et 0<unavailable<total tranche en jauge vide. (5) CONTRAT DOM DU GLISSEMENT que rien ne teste (hit-test stubbe en jsdom) + le seul changement structurel autorise : .band { position: relative }, absent aujourd'hui. (6) onWeekDateChange() ne recharge JAMAIS la heatmap en contexte de partie — sans consequence tant que la couche n'etait pas dessinee, muette des la 2e semaine a partir de cette story. (7) ⚠️ AC7 CONTRE AC3 : « le rail nomme les membres quel que soit le role » contredit l'AC3 et l'AC9 de la MEME story, EXPERIENCE.md:102, contrat-ui:465 et l'iteration:266 — tranche : noms pour le MJ, compteurs anonymes pour un joueur (l'inverse serait une exposition de donnees nouvelle que le serveur ne sert pas). (8) DEUX AC SUR NEUF SONT DEJA ACQUIS : AC8 (couche absente du calendrier personnel) et AC9 (Fenetres de la destinee, deja differenciee par CreneauCard/AggregatedCreneauCard) — a proteger par des tests, PAS a reimplementer. (9) LA FORME SUIT LA DONNEE, jamais isMjMode() qui derive de la route et non du role reel. 7 AC ajoutes (AC10 a AC16), dont AC14 = l'AC de securite (un joueur ne recoit aucune identite, jamais). SSE : ecart reel — heatmap n'est cable sur aucun signal changed(), il devient visible avec cette story, consigne en dette, hors perimetre. /security-review a lancer ICI (non optionnel sur l'epic, en dette depuis la 36.4, et c'est la seule story de l'epic qui elargit une reponse serveur avec des identites). 3 questions ouvertes a l'utilisateur : le perimetre serveur, l'arbitrage AC7/AC3, et le sort de la marge de 11 px en case etroite."

  36-9-le-mode-destinee-et-le-panneau-reduit-a-qui-manque:
    status: done
    review_note: "REVUE DE CODE (bmad-code-review) le 2026-08-22 : 3 couches paralleles (Blind Hunter, Edge Case Hunter, Acceptance Auditor), 2 patch tous corriges (l'effet de fin de mode AC9 desactivait TOUT nettoyage en contexte personnel des lors que partieId() etait absent, pas seulement le cas « hors plage » vise par le correctif d'origine — un vote reellement scelle/clos/supprime en personnel ne terminait donc jamais le mode ; corrige en gardant le dernier destinyDates() connu avant disparition et en ne terminant le mode que si la plage chargee (fromDateStr/toDateStr) couvrait deja pleinement ces dates, sans requete reseau ajoutee, encadre n°1 respecte ; nouveau test dedie. Commentaire SCSS de .calendar-controls affirmant align-items:center alors que le code declare flex-start, corrige). 6 rejetes comme bruit (toggleDestiny() qui reinitialise sur le premier vote a chaque reactivation, sans AC qui l'exige ; enterDestiny() sans validation d'id, aucun appelant actuel ne passe d'id invalide ; hypothese non verifiable sur allCells() en vue Mois, aucune preuve dans le diff ; contrat de getMissingVoters() confirme deja gere ; reutilisation litterale de getRespondedCount() non suivie mais mathematiquement equivalente et justifiee, deviation mineure de l'encadre n°10 ; commentaire « remplace ici et ici seulement » non structurellement garanti, note sans consequence). Post-patch : web 109/1961 (+1 test), typecheck web propre, aucune migration."
    implementation_note: "IMPLEMENTEE le 2026-08-22 (bmad-dev-story), Tasks 0 a 7, statut review. 🚨 DEUX DEFAUTS REELS TROUVES UNIQUEMENT PAR LA VERIFICATION VISUELLE, les 1960 tests etant verts avant chacun d'eux — cinquieme story d'affilee de l'epic dans ce cas. (1) L'ECRAN ENTIEREMENT ESTOMPE : activer la Destinee depuis un mois sans aucune date du vote courant estompait les 42 cases — techniquement correct, inutilisable. Regle ajoutee : UN MODE QUI ESTOMPERAIT TOUT N'ESTOMPE RIEN (l'estompe n'a de sens que RELATIVEMENT a ce qu'elle met en avant). (2) 🚨 LE MODE MOURAIT TOUT SEUL en calendrier personnel : deux clics sur « semaine suivante » et il s'eteignait DEFINITIVEMENT alors que le vote existait toujours — mon effet de fin de mode (AC9) lisait « absent de la liste » comme « clos », ce qui est vrai en contexte de PARTIE (activePolls derive de tous les scenarios) et FAUX en contexte personnel ou GET /me/calendar est charge PAR PLAGE. Garde sur partieId() + test qui navigue hors plage et revient. DECISIONS : l'etat du mode est un pollId JAMAIS UN INDEX (activePolls est reconstruit a chaque SSE) ; l'estompe a le JOUR pour unite dans LES DEUX vues, derivee UNE SEULE FOIS dans CalendarView depuis allCalendarEntries() NON FILTRE (jamais band.vote/pollVote, gouvernes par la couche : couche eteinte aurait donne un ensemble vide donc une grille entierement estompee) ; activer le mode ALLUME votes-en-cours (coup de pouce a sens unique) ; une case selectionnee, en apercu ou focalisee n'est jamais estompee (AC8, verifie en reel : 0.28 → 1 au focus) ; UNE OPACITE ET RIEN D'AUTRE, jamais pointer-events:none ni aria-hidden ni tabindex retire (AC3, verifie sur le DOM reel). Le panneau reduit est un COMPOSANT FRERE (app-poll-missing) et non une variante de PollStatusPanel, qui reste INTACT sur seance-list ou sa liste d'options porte LE SEUL CHEMIN DE SCELLEMENT DU PROJET. onChooseDate() SUPPRIME de CalendarView avec le panneau qui l'appelait (3 tests retires, 1 reoriente sur la garde pollActionPending via une reponse de vote) — seule modification de tests existants, consequence directe de l'AC4. AC7 : denominateur = poll.membersCount (serveur, MJ compris), jamais members().length. 3 cles de ton posees DANS LES TROIS THEMES ; poll.status_summary reutilisee. VU A L'OEIL (claude-in-chrome) : controle hors bande de couches, septembre 39 estompees / 3 nettes exactement sur les dates du vote, Semaine 18 cellules + 6 en-tetes estompes, AC10 confirme en direct sur une partie sans vote. Web 109 fichiers / 1960 tests (baseline 108/1933), lint web 143 = baseline, API 60/1303 INTACTE, apps/api et packages/shared NON TOUCHES, aucune migration. ❌ /security-review RESTE DU (non optionnel sur l'epic, dette depuis la 36.4) ; ❌ le panneau reduit n'a PAS ete vu a l'oeil (aucune partie MJ du jeu de donnees ne porte de vote ouvert, en creer un aurait ecrit dans les donnees de l'utilisateur) ; ❌ ecart signale : « Sceller ce creneau » depuis la barre de selection n'est porte par AUCUNE story de l'epic, et le calendrier n'a plus aucun chemin de scellement. 8 entrees ajoutees a deferred-work.md."
    epic: epic-36
    title: "Le mode Destinée et le panneau réduit à « qui manque »"
    last_updated: "2026-08-22"
    note: "Story creee le 2026-08-22 (bmad-create-story), exploration menee en direct (pas de sous-agents). DIX ENCADRES. (1) LA STORY EST VRAIMENT FRONT PURE, contrairement a la 36.8 : tout ce que le mode affiche est deja charge (activePolls, allCalendarEntries avec ses options eclatees depuis la 36.6, membersCount, getMissingVoters) — aucun endpoint, aucun DTO, aucune migration, apps/api pas touchee du tout. (2) LE MODE N'EST PAS UNE COUCHE : il ne rejoint jamais CALENDAR_LAYER_KEYS (sinon il deviendrait un reglage persistant soumis a resetToDefault et a l'ecran Compte), il reste hors du panneau des couches (AC5), et son etat est un pollId JAMAIS UN INDEX — activePolls() est reconstruit a chaque scenariosSvc.changed(), un index ferait basculer la Destinee sur un autre vote en silence. (3) 🚨 LE DEFAUT LE PLUS PROBABLE DE LA STORY : deriver l'estompe de band.vote / DaySlotDetail.pollVote, qui sont GOUVERNES PAR LA COUCHE votes-en-cours — couche eteinte ⇒ ensemble vide ⇒ la grille ENTIERE s'estompe, et aucun test existant ne le verrait. Source imposee : allCalendarEntries() NON FILTRE, derive une seule fois dans CalendarView, transmis en ReadonlySet<string> aux deux vues (patron seanceMarkerDates, doctrine AD-12/AD-19, AC12). Unite de l'estompe : LE JOUR dans les deux vues, comme la planche. Corollaire AC6 : activer le mode allume votes-en-cours si elle est eteinte (coup de pouce a sens unique). (4) LE PANNEAU A REDUIRE EST CELUI DU CALENDRIER ET LUI SEUL : PollStatusPanel est rendu a TROIS endroits, dont deux sur seance-list ou la liste des options et son bouton de scellement sont LE SEUL CHEMIN DE SCELLEMENT DU PROJET ; vider le composant casserait 5 tests de seance-list.spec.ts. Recommande : un composant frere dans features/calendar/, symetrique de ce que la 36.7 a fait pour app-poll-response. (5) ⚠️ CE QUE LA PLANCHE MONTRE ET QUE LA STORY NE LIVRE PAS : « Ajouter des dates » et le retrait de « Planifier un vote pour : » = 36.10 ; la barre repliee = 36.14 ; et surtout « SCELLER CE CRENEAU » DEPUIS LA BARRE DE SELECTION N'EST PORTE PAR AUCUNE STORY DE L'EPIC (la 36.12 ne couvre que le scellement depuis l'Agenda) — ecart signale, question posee. (6) ⚠️ « QUI MANQUE » HERITE D'UNE DETTE ECRITE : getMissingVoters derive de listMembers(), qui n'a jamais renvoye le MJ (aucune ligne Membership) alors que le MJ peut voter. La dette existait deja (deferred-work.md, 36.6) mais devient LE CONTENU ENTIER DU PANNEAU. Non refermee ici (il faudrait toucher listMembers, route partagee, ou ajouter un GET /parties/:id interdit par l'encadre 1) ; a la place, AC7 impose que le denominateur affiche soit poll.membersCount (valeur serveur, MJ compris) et jamais members().length. (7) AC3 « aucun geste ne change de signification » : table exhaustive des gestes + TROIS INTERDITS — jamais pointer-events:none (le glissement casserait et le hit-test est stubbe en jsdom), jamais aria-hidden/tabindex/disabled, aucun nœud ajoute dans .day-cell/.slot-cell/.band. (8) AC8, defaut previsible : opacity:.28 avale le lisere de selection, l'apercu et l'anneau de focus — glisser sur des jours estompes ferait disparaitre sa propre selection. Un jour selected/preview/focus n'est jamais estompe. (9) ⚠️ LE DEPOT N'EST PAS PROPRE AU DEMARRAGE : la story 36.8 est implementee et NON COMMITEE (29 fichiers) ; ne rien reinitialiser, mesurer la baseline sur l'arbre tel quel. (10) Ce qui existe deja et ne doit pas etre reecrit. 12 AC (5 verbatim d'epics.md + 7 ajoutes avec leur motif), 8 taches dont une verification visuelle obligatoire via claude-in-chrome. Evaluation SSE : aucun cablage nouveau (aucune source de donnee ajoutee) mais AC9 exige que le mode SACHE MOURIR quand son vote disparait — meme piege que le selecteur de la 36.7, que l'effet SSE ferme explicitement. Securite : story la plus legere de l'epic (aucune ecriture, aucune lecture nouvelle) ; seul point de vigilance, en contexte personnel le mode traverse des votes de PLUSIEURS parties — ne jamais supposer que le vote courant appartient a la partie de la route. TROIS QUESTIONS posees a l'utilisateur en fin de story (scellement depuis la barre ; dette du MJ manquant ; Destinee disponible ou non sur /profile/calendar)."

  36-10-composer-un-vote-depuis-la-grille:
