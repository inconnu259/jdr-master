<app-auth-band />
<main class="auth-page" aria-labelledby="auth-title">
  <mat-card class="auth-card">
    <mat-card-header><h1 matCardTitle id="auth-title" class="auth-title">Connexion</h1></mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline">
          <mat-label>Email ou pseudo</mat-label>
          <input
            matInput
            type="text"
            formControlName="identifier"
            appAuthAriaInvalid
            autocomplete="username"
          />
          <mat-error>{{ fieldError('identifier') }}</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Mot de passe</mat-label>
          <input
            matInput
            type="password"
            formControlName="password"
            appAuthAriaInvalid
            autocomplete="current-password"
            appPasswordReveal
            #pw="appPasswordReveal"
          />
          <app-password-toggle matSuffix [for]="pw" />
          <mat-error>{{ fieldError('password') }}</mat-error>
        </mat-form-field>
        @if (error()) {
          <p class="error" role="alert">{{ error() }}</p>
        }
        <button mat-flat-button class="auth-primary" type="submit" [disabled]="loading()">
          Se connecter
        </button>
      </form>
    </mat-card-content>
    <mat-card-actions class="auth-secondary-actions">
      <a class="auth-secondary-link" routerLink="/forgot-password">Mot de passe oublié ?</a>
    </mat-card-actions>
    <p class="auth-orientation">{{ tone()['auth.login_invite_only'] }}</p>
  </mat-card>
</main>
