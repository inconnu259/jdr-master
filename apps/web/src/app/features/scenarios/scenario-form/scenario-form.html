<mat-card class="form-card">
  <mat-card-title>{{ theme.tone()['scenarios.form_title'] }}</mat-card-title>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <mat-form-field appearance="outline">
      <mat-label>{{ theme.tone()['common.titre'] }}</mat-label>
      <input matInput formControlName="title" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>{{ theme.tone()['scenarios.form_description_label'] }}</mat-label>
      <textarea matInput formControlName="description" rows="3"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>{{ theme.tone()['scenarios.form_duree_heures_label'] }}</mat-label>
      <input matInput type="number" formControlName="dureeHeures" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>{{ theme.tone()['scenarios.form_duree_seances_label'] }}</mat-label>
      <input matInput type="number" formControlName="dureeSeances" />
    </mat-form-field>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
    <div class="actions">
      <button mat-button type="button" (click)="cancel()">
        {{ theme.tone()['common.annuler'] }}
      </button>
      <button mat-flat-button type="submit" [disabled]="saving() || form.invalid">
        {{ theme.tone()['common.creer'] }}
      </button>
    </div>
  </form>
</mat-card>
