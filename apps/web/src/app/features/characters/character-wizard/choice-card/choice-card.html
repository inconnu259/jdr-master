<button
  type="button"
  class="choice-card"
  [class.choice-card--selected]="selected()"
  [class.choice-card--center]="align() === 'center'"
  [class.choice-card--expanded]="expanded()"
  role="radio"
  [attr.aria-checked]="selected()"
  [attr.aria-label]="option().label"
  [attr.aria-describedby]="showDetail() ? detailId : null"
  (click)="onClick()"
>
  <span class="choice-card__label">{{ option().label }}</span>
  @if (expanded() && expandedHint()) {
    <span class="choice-card__hint">{{ expandedHint() }}</span>
  } @else if (showDetail(); as text) {
    <span class="choice-card__detail" [id]="detailId">{{ text }}</span>
  }
</button>
