<div class="portrait-cropper">
  <label class="portrait-cropper__file-label">
    {{ theme.tone()['portrait.cropper_choose_image'] }}
    <input
      type="file"
      accept="image/jpeg,image/png,image/webp"
      (change)="onFileSelected($event)"
    />
  </label>

  @if (previewUrl(); as url) {
    <div
      class="portrait-cropper__preview"
      [class.portrait-cropper__preview--rect]="effectiveShape() === 'rect'"
      [style.aspect-ratio]="effectiveShape() === 'rect' ? aspectRatio : null"
      tabindex="0"
      role="application"
      [attr.aria-label]="theme.tone()['portrait.cropper_area_aria']"
      (keydown)="onKeydown($event)"
      (pointerdown)="onPointerDown($event)"
      (pointermove)="onPointerMove($event)"
      (pointerup)="onPointerUp($event)"
    >
      <img
        class="portrait-cropper__preview-img"
        [src]="url"
        [style.transform]="transform()"
        alt=""
        draggable="false"
        (dragstart)="$event.preventDefault()"
      />
    </div>

    <label class="portrait-cropper__zoom">
      {{ theme.tone()['portrait.cropper_zoom'] }}
      <input
        type="range"
        min="1"
        max="3"
        step="0.05"
        [value]="scale()"
        (input)="onZoomChange($any($event.target).valueAsNumber)"
      />
    </label>
  }

  <div class="portrait-cropper__actions">
    @if (showSkip()) {
      <button mat-button type="button" (click)="skipStep()">{{ theme.tone()['common.passer_cette_etape'] }}</button>
    } @else {
      <button mat-button type="button" (click)="cancel()">{{ theme.tone()['common.annuler'] }}</button>
    }
    <button mat-flat-button color="primary" type="button" [disabled]="!file()" (click)="save()">
      {{ theme.tone()['common.enregistrer'] }}
    </button>
  </div>
</div>
