@if (editing()) {
  <span class="field-edit-pencil__form">
    <input
      class="field-edit-pencil__input"
      [type]="type()"
      [value]="draft()"
      [attr.list]="options().length ? datalistId : null"
      (input)="onInput($any($event.target).value)"
    />
    @if (options().length) {
      <datalist [id]="datalistId">
        @for (opt of options(); track opt.key) {
          <option [value]="opt.key">{{ opt.label }}</option>
        }
      </datalist>
    }
    <button
      mat-icon-button
      type="button"
      class="field-edit-pencil__confirm"
      [attr.aria-label]="theme.tone()['common.valider']"
      (click)="submit()"
    >
      ✓
    </button>
    <button
      mat-icon-button
      type="button"
      class="field-edit-pencil__cancel"
      [attr.aria-label]="theme.tone()['common.annuler']"
      (click)="cancel()"
    >
      ✕
    </button>
  </span>
} @else {
  <button
    type="button"
    class="field-edit-pencil__button"
    [attr.aria-label]="fieldEditAria()"
    (click)="startEdit()"
  >
    ✎
  </button>
}
