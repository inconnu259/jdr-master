  36-12-lagenda-du-mj-options-depliees-et-scellement:
    status: done
    last_updated: "2026-08-23"
    note_review: "REVUE DE CODE (bmad-code-review) le 2026-08-23. 7 decision-needed : 3 corriges en direct (badge sans action sur ligne degradee, ecrasement silencieux de composition en cours, missingByPoll non rafraichi/ambigu), 2 rejetes apres verification (ordre onViewChange/startCompose non problematique ; deferred-work.md/sprint-status.yaml faux positif — _bmad-output est gitignore, git diff ne peut jamais les montrer), 2 verifies/actes (AC16 amendee pour la cle action_seal dediee ; scellement reel EXERCE POUR DE VRAI via Chrome MCP sur Les Veilleurs du Pont — vote 14 creneaux scelle, ligne passee en Ce qui est prevu ; NOTE : ce vote MJ de dev est desormais consomme). 10 patch findings tous appliques (thematisation discloseLabel/Renoncer, garde double-dialogue de scellement, slot dans le resume de dates, garde de longueur sur action_launch_poll, memoisation du badge de vote, garde partieId sur missingByPoll, membersCount au maximum plutot qu'a la premiere option, docstring cancel() corrigee, commentaire defensif sur pollRespondedCount). 1 defer (nearestDate vide si toutes options sans date). Web 2117 tests verts (+4), lint 142 = baseline exactement, aucune regression."
    note_impl: "IMPLEMENTEE le 2026-08-23 (bmad-dev-story), taches 0 a 9. L'Agenda cesse de rendre UNE LIGNE PAR OPTION et rend UNE LIGNE PAR VOTE : 21 lignes deviennent 3 sur le jeu de developpement, la ligne « Les Veilleurs du Pont » resumant ses 14 creneaux en une phrase. Le regroupement vit A L'AFFICHAGE — un test dedie verifie que calendarEntries() (Mois, Semaine, rail) recoit toujours une entree par option, et la grille du Mois marque toujours chaque creneau propose a l'ecran. Q-25 CLOSE et codee : mur = tout le monde a repondu (min des respondedCount == membersCount) OU une option reunit la majorite absolue (yes*2 > membersCount) ; le critere d'echeance est abandonne, expiresAt n'etant ecrit NULLE PART. LE PIEGE LE PLUS COUTEUX A ETE EVITE PAR LA FORME DE L'ETAT : le depliement retient une INTENTION EXPLICITE du lecteur (Map<pollId, boolean>), pas une inversion de la maturite — avec une inversion, un vote deplie a la main qui devient mur en direct (SSE) se refermerait tout seul sous les yeux du lecteur. DEUX DEFAUTS REELS TROUVES A L'ECRAN, invisibles aux tests. (1) Le compteur et ma reponse etaient rendus DEUX FOIS par option : <app-poll-track> les emet deja (36.6) et mes deux span les redoublaient — retires, les tests interrogent desormais app-poll-track .cnt/.mine. (2) LA STORY AVAIT TORT SUR UN POINT : elle prescrivait de reutiliser cta.choose_date pour le bouton Sceller, mais c'est une PHRASE (« Planter le drapeau de la clairiere ») ecrite pour LE bouton unique d'un panneau — repetee sous chacune des 14 options elle passait a la ligne et doublait la hauteur de chaque option (65 px contre 39 px). Cle dediee calendar.agenda.action_seal (mot court de la planche), phrase longue gardee sur le dialogue ; un test borne la cle a 14 caracteres pour que la relecture editoriale de la 35.3 ne la rallonge pas sans le voir. Contraste du bouton mesure a 5,84 / 6,50 / 7,92 dans les trois themes. NON EXERCE A L'ECRAN, consigne : l'ECRITURE du scellement (le dialogue a ete ouvert puis REFUSE — confirmer aurait ferme definitivement le seul vote MJ du jeu de developpement, irreversible depuis l'interface ; 5 tests couvrent le chemin d'ecriture) et le franchissement du seuil de maturite en direct. Web 111 fichiers / 2113 tests verts (baseline 111/2043), lint 142 = baseline, aucun fichier de apps/api ni packages/shared, aucune migration."
    epic: epic-36
    title: "L'Agenda du MJ, options dépliées et scellement"
    note: "Story créée le 2026-08-23 (bmad-create-story). ⚠️ Q-25 EST TRANCHÉE par l'utilisateur, la story n'est plus bloquée : un vote est « mûr » si tout le monde a répondu à toutes ses options (min(respondedCount) == membersCount) OU si une option réunit la majorité absolue de l'effectif en oui (max(yes)*2 > membersCount). Le troisième critère du PRD — « l'échéance approche » — est ABANDONNÉ sur un constat de fait : SessionPoll.expiresAt est nullable et n'est écrit NULLE PART (la seule création, poll.service.ts:63-76, ne le renseigne pas), et il n'existe même pas sur MyCalendarPollEntry. À répercuter dans le PRD (:481), EXPERIENCE.md (point ouvert 13) et l'annotation 23 de la planche. SECONDE DÉCISION UTILISATEUR : « Lancer un vote » depuis l'Agenda bascule sur la vue Mois et arme le mode de composition de la 36.10 ciblé sur la séance (ComposeTarget étendu d'un seanceId optionnel ; ComposeConfirmDialog inchangé, il pré-remplit déjà quand il n'y a qu'une séance). LE CŒUR DE LA STORY N'EST PAS LE SCELLEMENT MAIS LE REGROUPEMENT : la planche montre UNE LIGNE PAR VOTE aux deux rôles (planche 3 joueur, planche 5 MJ), alors que l'Agenda rend aujourd'hui une ligne par OPTION — héritage de l'éclatement de la 36.6, qui existe pour la grille et a débordé sur la liste (21 lignes sur le seul jeu de développement, toutes des options d'un même vote, deferred-work.md:23). ⚠️ Renverse donc un rendu livré la veille par la 36.11, À L'AFFICHAGE UNIQUEMENT — allCalendarEntries() garde son éclatement, dont dépendent le Mois, la Semaine et le rail. TROISIÈME PIÈGE DÉSAMORCÉ : « les options se déplient d'office » veut dire PAR DÉFAUT, pas EXCLUSIVEMENT — un vote non mûr rendu sans ses options priverait tout joueur du seul chemin de réponse depuis l'Agenda (la ligne d'option est l'unique ancre du sélecteur de la 36.7). La maturité gouverne l'état initial du dépliement, un clic déplie/replie le reste. Scellement réservé au contexte de partie en mode MJ : le calendrier personnel ne sait pas de quelle partie on est MJ et ne doit pas l'apprendre (AD-9). Zéro octet serveur : PollService.choose() est intact, MJ seul via getOwned, et émet déjà partieTopic + notifyPartieSignalsChanged."

  36-13-la-grille-semaine-a-densite-variable:
    status: done
    note_impl: "IMPLEMENTEE le 2026-08-20 (bmad-dev-story), Tasks 1 a 6, statut review. La vue Semaine recoit entries et activeLayers (LES MEMES EXPRESSIONS QUE LE MOIS, aucun signal nouveau) et derive son contenu du POINT UNIQUE buildMonthDetails + composeSeanceInfo(compact) : aucune regle de preseance reecrite (AC7). Q-24 CLOSE : container query week-grid a 500 px, ZERO logique de largeur en TS, donc AC5 satisfait structurellement. LA MESURE QUI TRANCHE Q-24 A ETE FAITE A LECRAN : en contexte de partie panneau ouvert, fenetre 1384 px et grille 398 px, soit 986 px decart — une media query aurait affiche la branche dense dans des colonnes de 48 px. DEUX DEFAUTS REELS TROUVES ET CORRIGES. (1) LA SEMAINE CONTREDISAIT LE MOIS ET LE RAIL : le statut de la cellule venait de computeDisplayStatus, qui IGNORE les seances ; la regle FR-50 (une seance rend le creneau indisponible) vit dans buildDayDetail et la Semaine ne lavait jamais eue — le meme jour saffichait pris en Mois et non declare en Semaine. Corrige, et visible a lecran sur la seance du 1er juin. (2) TROUVE A LOEIL, INVISIBLE AUX 1758 TESTS : decl-label partait sur TROIS lignes dans une colonne de 43 px et faisait exploser la hauteur de la cellule (word-break sans nowrap, defaut PRE-EXISTANT que la densite rendait intenable) — corrige, hauteur uniforme a 66 px, et sous le seuil une cellule portant un evenement ne montre que lui. VERIFICATION VISUELLE REELLE FAITE dans Chrome (session ouverte par lutilisateur) sur les trois cas exiges : largeur contrainte 360 px, contexte de partie panneau ouvert, et branche large. DIVERGENCE ASSUMEE LIVREE : sous le seuil, le titre entier tronque par CSS et non un seul mot — a repercuter sur epics.md AC3 et sur la planche. Web 103 fichiers / 1758 tests (baseline 1748, +10), lint 143 = baseline, build en echec sur le seul budget de bundle pre-existant. AC6 confirme par git status : aucun fichier du Mois modifie, ni API, ni packages/shared. NON VU A LOEIL : les informations pratiques en cellule — aucune seance du jeu de donnees nen porte, couvertes par les tests seulement, A REGARDER EN REVUE DE CODE. OBSERVATION CONSIGNEE, hors perimetre : la cellule NOMME levenement mais ne le MARQUE pas (ni lisere de vote ni filet de seance, contrairement au contrat dUI) — cest aussi le fond sur lequel la 36.6 posera sa piste. Dette a ecrire dans deferred-work.md : pastille seance-dot devenue doublon, divergence Soiree/Soir, et le marquage de rang absent en Semaine. /SECURITY-REVIEW TOUJOURS DU depuis la 36.4 : non aggrave par cette story front-only, non solde."
    last_updated: "2026-08-20"
    note: "REVUE DE CODE (bmad-code-review) le 2026-08-20 : 3 couches paralleles (Blind Hunter, Edge Case Hunter, Acceptance Auditor), 9 constats retenus, 1 decision-needed resolue par lutilisateur (aligner preview sur le Mois) + 4 patch tous corriges (bogue critique de cascade CSS empechant .decl-label de jamais reapparaitre au-dessus du seuil, ordre de regles inverse a specificite egale ; preview ignorait les seances et pouvait afficher disponible sur une case verrouillee pendant un glissement, ecart pourtant deja documente et assume par la story mais confirme comme defaut reel par deux revues independantes, corrige via weekPreviewDetails meme patron que le Mois ; has-event utilisait un test dinegalite au lieu dun test de verite, une chaine vide aurait marque la cellule sans rien afficher ; cellAriaLabel calculait composeSeanceInfo sans le garde winner=seance deja signale en revue de la 36.5 sur le rail ; min-height 44px sous le seuil ne correspondait pas aux 38px du contrat dUI sans justification consignee), 4 rejetes non actionnables ou deja couverts (tests tautologiques UTC/locale, ecart cosmetique gouttiere/container query deja documente comme volontaire, switch dicones sans branche par defaut sur un tableau fixe non atteignable, AC3 un seul mot deja pre-autorise et consigne pour suivi hors story). Post-patch : web 103/103 fichiers, 1758/1758 tests, lint 143 = baseline. ❌ /SECURITY-REVIEW TOUJOURS DU, non couvert par cette revue de code. Story creee le 2026-08-20 (bmad-create-story), quatre sous-agents dexploration. PRISE HORS ORDRE, AVANT LA 36.6, sur decision de lutilisateur : la 36.6 exige une vue Semaine capable de porter un vote, or CalendarWeekView ne recoit ni entries ni activeLayers et ne connait des seances quune pastille au niveau JOUR ; la 36.13 (Front pur) ne depend de rien qui reste a faire — ses trois prerequis reels (rail 36.1, selection 36.3, informations pratiques 36.5) sont done, et aucune story de 36.6 a 36.12 ne touche la Semaine. Q-24 CLOSE : le seuil de densite est un CONTAINER QUERY SUR LA GRILLE a 500 px (week-grid), pas une media query — motif : en contexte de partie un panneau lateral prend ~40 pourcent de la largeur et une media query mentirait, exactement le raisonnement deja consigne pour le Mois (calendar-month-view.scss:63-70) ; consequence gratuite, 100 pourcent CSS donc AUCUNE vue supplementaire instanciee (AC5) et rien a tester en TS. ⚠️ DIVERGENCE FRONTALE ASSUMEE, a repercuter par bmad-ux/correct-course : sous le seuil, la cellule affiche LE TITRE ENTIER TRONQUE PAR CSS et non un seul mot — aucune regle deterministe ne reproduit les deux exemples de la planche (Les Cendres dAshal donne Ashal = dernier mot, Le Convoi du Nord donne Convoi = deuxieme mot, choix de designer faits a la main) ; motif du choix : zero logique a tester et jamais de mot trompeur, le rail restant porteur du texte complet a toutes les largeurs. DOUZE AC : les six depics.md verbatim + AC7 (un seul point de derivation, buildMonthDetails + composeSeanceInfo, jamais une troisieme copie de SLOT_PRECEDENCE), AC8 (aucun appel reseau — entries et activeLayers sont deja en memoire au point dappel), AC9 (le geste survit : les 26 tests existants passent SANS modification de leurs assertions), AC10 (le vote est nomme des cette story, sa piste attend la 36.6), AC11 (les couches gouvernent la cellule, lindisponibilite demeure), AC12 (nom accessible non tronque — le defaut exact releve en revue de code de la 36.5 sur le rail). SIX ENCADRES, dont le n°3 est le plus dangereux : le glissement fait son hit-test par elementFromPoint + closest([data-cell-date]), et elementFromPoint EST STUBBE dans les tests (jsdom sans geometrie) — un noeud qui sortirait de la cellule casserait le geste EN PRODUCTION en laissant les 15 tests de glissement VERTS. Deux regles opposables : tout noeud est descendant de .slot-cell, et porte pointer-events:none. Le patron a imiter est ecrit en entier : la vue Mois calcule TOUJOURS son texte et le laisse TOUJOURS dans le DOM, seul le CSS masque. QUINZE PIEGES consignes. Le niveau de densite compact de composeSeanceInfo nest consomme par personne : cest celui de la cellule large. Portee : front pur, aucune migration, aucun changement API ni packages/shared. Evaluation SSE faite : aucun cablage nouveau, la Semaine herite du temps reel du Mois du seul fait detre branchee sur le meme signal. Securite : aucune surface serveur, seul risque = XSS par [innerHTML] sur un titre, interdit. Dette REFERMEE : le report de la cellule de Semaine par la 36.5, le doublon dateKey/toDateKey, et lAC4 de la 36.6. Dette NON refermee et a consigner : la pastille .seance-dot devenue doublon, la divergence Soiree/Soir, les blocs jumeaux de selection Mois/Semaine, deferred-work.md:7. ❌ /security-review TOUJOURS DU depuis la 36.4 — non aggrave par cette story, non solde. Baseline a reconfirmer (HEAD = 711b0b3, working tree propre) : web 103 fichiers / 1748 tests, lint 143. VERIFICATION VISUELLE OBLIGATOIRE, en portrait, en paysage ET en contexte de partie panneau ouvert — ce dernier cas est le seul qui puisse dementir le container query."
    epic: epic-36
    title: "La grille Semaine à densité variable"

  36-14-la-barre-repliee-la-legende-et-les-preferences:
    status: done
    review_note: "REVUE DE CODE (bmad-code-review) le 2026-08-23 : 3 couches paralleles (Blind Hunter, Edge Case Hunter, Acceptance Auditor), 15 constats bruts fusionnes en 13. 1 decision-needed (AC1 viole en contexte de partie MJ, barre sur deux lignes) resolue par l'utilisateur : cause racine identifiee en creusant le layout (plafond global .content:60rem du Shell rendait mort le plafond de 72rem deja voulu par partie-detail.scss depuis la story 6.1) et corrigee a la source (Shell elargi a 90rem des 1024px) plutot que rafistolee sur la barre. 10 patch tous corriges : refonte de ngOnInit en abonnement reactif a route.paramMap (partieId(), memoire de session, canal temps reel et toutes les donnees scopees a la Partie se rechargent desormais sur un changement de :id sans destruction du composant, encadre n2 de la story enfin honore, 4 tests dedies) ; cdkTrapFocus sur les deux surfaces du panneau Affichage (focus capture a l'ouverture + piege de focus, corrige 3 constats en un geste) ; retrait du handler (detach) qui fermait le panneau au franchissement du seuil desktop/mobile au lieu de basculer menu->feuille ; collision de cle de session entre /calendar (MJ) et /guild-calendar (personnel) pour un meme partieId, suffixe :guild ajoute ; entree de legende GroupGauge sans classe d'hote (meme defaut que PollTrack, corrige ailleurs dans ce diff mais pas la) ; selecteur CSS mort dans calendar-display-panel.scss (inatteignable sous l'encapsulation de vue), deplace en classe d'hote dans calendar-layer-toggle.scss ; aria-haspopup manquant sur le declencheur ; course de rollback optimiste dans onIntentToggle() (deux bascules rapprochees echouant toutes les deux pouvaient laisser l'UI sur une valeur jamais confirmee), confirmedLayers partage introduit. 1 patch verifie sans changement necessaire (aria-hidden sur pastilles de legende : ni PollTrack ni GroupGauge ne rendent d'element focalisable aujourd'hui). 2 rejetes comme bruit (legende .legend__swatch vs .band litteral de l'encadre 4, styles calcules identiques via partial partage ; clear() sur effet currentUser plutot que sur AuthService.logout(), ecart deja auto-consigne et justifie). Post-patch : web 114/2188 (+4 tests), lint 142 = baseline exactement, aucune migration."
    epic: epic-36
    last_updated: "2026-08-23"
    note_impl: "IMPLEMENTEE le 2026-08-23 (bmad-dev-story), taches 0 a 11. FRONT PUR : aucun fichier de apps/api ni packages/shared, aucune migration, aucune dependance, aucun appel reseau nouveau (AC21 verifie par git status). LE PIEGE DE PERIMETRE DE deferred-work.md:70 (cabler la heatmap sur le temps reel) A ETE EVALUE ET ECARTE : chantier serveur, P-5 interdit de le decider en chemin. LA MEMOIRE DE SESSION N'EMPLOIE AUCUN STOCKAGE WEB, et c'est le coeur de la story : sessionStorage SURVIT A UN RECHARGEMENT dans le meme onglet, ce qui aurait rendu l'AC10 faux en production tout en laissant la suite verte (jsdom ne recharge rien). Une Map en RAM dans un service racine satisfait les quatre branches sans une ligne dediee, et un test verrouille l'absence de tout Storage.setItem. ECART MINEUR ASSUME avec la story : clear() est branche sur le signal currentUser et non sur AuthService.logout() — un service de features/ injecte dans core/ aurait inverse la direction des dependances, et currentUser retombe a null sur TOUTE perte de session. LA LEGENDE NE REDESSINE RIEN : _band-ranks.scss, PREMIER PARTIAL SCSS DU PROJET, devient la source unique des cinq traitements de rang, incluse par la vue Mois ET par la legende. VERIFIE A LA MESURE ET PAS A L'OEIL : fond et filet identiques au bit pres entre pastille et bande, seule differe la couleur heritee d'une bordure de 0 px. La participation et le groupe instancient les VRAIS PollTrack et GroupGauge — le trou des pastilles par membre (MJ <=6) se referme donc structurellement. DEUX DEFAUTS REELS TROUVES A L'ECRAN, invisibles aux 2182 tests d'alors. (1) La piste de legende passait SOUS son libelle : PollTrack emet toujours son compteur, et la densite d'une surface se regle depuis poll-track.scss, jamais depuis le SCSS de l'appelant — LE PIEGE DE LA 36.6 AU MEME ENDROIT, DEUX STORIES PLUS TARD. Corrige par :host(.in-legend) + test de garde. (2) LA MESURE QUI A CHANGE LA CONCEPTION : en contexte de partie la barre ne fait que 380 px dans une fenetre de 1725 px (le panneau MJ prend la moitie), or les trois libelles longs de la bascule pesent 319 px — la barre repassait a TROIS LIGNES, exactement le defaut que la story existe pour reparer. CONTAINER QUERY sur .calendar-controls (seuil 560 px) vers la forme abregee du contrat (Mois/Sem./Agenda), les deux formulations restant TOUJOURS dans le DOM et le nom accessible gardant la forme longue. Raisonnement de la 36.13 retrouve independamment par la mesure ; a distinguer de la media query du panneau (D-1), qui gouverne un overlay ancre au viewport. VU A L'ECRAN, sans AUCUNE ecriture en base : barre sur UNE SEULE LIGNE a 42 px (colonne 896 px, la grille commence en haut de page), menu ancre 4 couches en personnel / 5 en partie, aucune pastille au defaut, pastille « Affichage filtre · 3 sur 4 · Retablir » puis « 4 sur 5 », legende a 5 entrees en personnel / 7 en partie avec la vraie jauge, quatre intentions de compte sans « Les inscriptions ouvertes », Echap qui ferme et rend le focus. Contrastes mesures dans les trois themes : bouton 6,49/7,17/5,02 et pastille 9,98/9,23/5,95, tous au-dessus d'AA. ❌ NON VU A L'ECRAN : la feuille du bas (branche telephone) — CONFIRME SUR PLACE, resize_window ne touche pas innerWidth, fige a 1725, donc matchMedia repond toujours true (limite deja consignee par la 36.11) ; et l'ecriture d'une intention, qui aurait ecrit en base (couverte par 12 tests). ⚠️ ECART ASSUME MESURE : en contexte de partie MJ la barre tient sur DEUX lignes (78 px) — declencheur 99 + « Ajouter des dates » 132 (herite de la 36.10) + bascule abregee 217 = 448 pour 380 px de colonne. Strictement mieux qu'avant (trois lignes avant la container query, deux des 1400 px avant la story), et le cas « au repos » du contrat tient bien sur une ligne. DETTE CONSIGNEE NON INTRODUITE : les textes de legende mesurent 4,36 en Medieval Steampunk, sous AA — cause racine deja documentee (deferred-work.md:36), --jdr-text-muted y plafonne a ~4,4:1 et affecte TOUT texte muet du theme ; c'est la PALETTE qu'il faut corriger (epic 35), diverger du contrat pour la masquer aurait ete pire. QUATRE TESTS ONT CHANGE DE VERITE et le disent en commentaire, aucun n'a ete supprime. Evaluation SSE faite : aucun cablage nouveau (AD-14, l'etat personnel n'emet pas). Web 114 fichiers / 2184 tests verts (baseline 111/2117, +67), lint 142 = baseline EXACTEMENT. ❌ /security-review TOUJOURS DU et NON OPTIONNEL sur cet epic : story front pure, elle N'AGGRAVE PAS la dette et ne la SOLDE PAS."
    note: "Story creee le 2026-08-23 (bmad-create-story), quatre sous-agents d'exploration. DERNIERE STORY DE L'EPIC 36, portee FRONT PURE (epics.md:1930) : aucune derogation serveur (D-15 a D-18 sont toutes ailleurs), MIGRATION PRISMA EXPLICITEMENT INTERDITE (epics.md:2547 + addendum.md:83 : retirer une cle imposerait une migration de preferences livrees trois jours plus tot). ONZE AC verbatim d'epics.md + DIX de comblement (AC12 a AC21), SIX ENCADRES, CINQ DECISIONS (D-1 a D-5), QUINZE PIEGES. LA DECISION LA PLUS CONTRE-INTUITIVE, encadre n1 : LA MEMOIRE DE SESSION N'EMPLOIE AUCUN STOCKAGE WEB. Le reflexe sessionStorage est FAUX — il SURVIT A UN RECHARGEMENT dans le meme onglet, or l'AC10 exige qu'un rechargement reparte du defaut de compte ; le defaut serait invisible aux tests (jsdom ne recharge rien). Un service racine gardant une Map EN MEMOIRE satisfait les quatre branches gratuitement (rechargement = service reconstruit vide, deconnexion = clear(), autre calendrier = autre cle, « aucun mecanisme de detection » = trivialement vrai) et respecte AD-13, qui reserve localStorage au theme. SECONDE DECISION STRUCTURANTE, encadre n4 : LA LEGENDE NE REDESSINE RIEN — elle instancie les VRAIES classes (.band[data-winner]) et les VRAIS composants (app-group-gauge, app-poll-track). Motif : l'annotation 31 du contrat exige la reproduction EXACTE du traitement reel, or trois valeurs divergentes circulent deja pour la seule trame (42% code, 70% planche, 40% DESIGN) et le vote porte un LISERE gauche dans le code contre un FILET dans la planche — ecart deja arbitre par la 36.2 au nom de P-1 et commente dans calendar-month-view.scss:233. La fidelite devient structurelle, elle ne peut plus se perimer. Consequence gratuite : le trou A-4 (pastilles par membre non legendees pour un MJ a <=6 membres) se referme tout seul, le composant choisissant lui-meme sa forme. PIEGE DE PERIMETRE LE PLUS COUTEUX, ECARTE : deferred-work.md:70 invite NOMMEMENT la 36.14 a cabler GET /parties/:id/heatmap sur le temps reel — chantier SERVEUR exigeant une decision d'architecture, interdit par la portee « Front » et par P-5 (prd.md:57, « jamais decidee en chemin »). L'evaluation a ete faite : elle conclut que ca n'entre pas ici. DETTE VOISINE A CONNAITRE : deferred-work.md:117 documente que CalendarView peut survivre a un changement de parametre de route sans destruction — c'est EXACTEMENT le mecanisme qui ferait fuiter la memoire de session d'un calendrier vers l'autre (encadre n2) ; la cle doit deriver du signal partieId(), jamais etre capturee au montage. SURFACES : MatMenu est PROSCRIT (shell.spec.ts:111 l'interdit par test) et MatBottomSheet n'existe pas dans le projet — le patron ordinateur est le cdkConnectedOverlay de la 36.7 (deja dans calendar-view.html:314), le patron telephone est la feuille maison de ConstraintPanel. Le patron de repli existe aussi deja : shared/list-control-bar (signal expanded, repli CSS, pastille hasDeviatedFromDefault). DECISIONS POSEES faute d'arbitrage dans les artefacts : D-1 seuil (min-width:1024px), le seuil UNIQUE du projet, media query et non container query car la surface est un overlay ancre au viewport ; D-2 la legende se rend SOUS la grille et sous le rail (au-dessus est exclu par la raison d'etre meme de la story, dans le panneau est exclu par « l'ecran doit rester lisible sans elle ») ; D-3 la case d'intention « dispos & indispos » est INDETERMINATE en etat mixte herite de la 30.4, sans quoi un premier clic supprimerait silencieusement une couche active ; D-4 « Retablir » existe a DEUX endroits (pastille + panneau), le contrat dessinant les deux ; D-5 le masquage au defilement de ListControlBar n'est PAS repris. AC17 EST LE PIEGE FIN : ne pas restreindre isOverridden() a availableLayerKeys() — la pastille apparaitrait a tort pour tout compte portant encore inscriptions-ouvertes (garde-fou pose par la 36.11). ⚠️ DIVERGENCES A REPERCUTER par bmad-ux/correct-course : filet vs lisere du vote dans la planche, trame de legende a 70% contre 42% reels, opacites DESIGN 28% contre 32% livres. ⚠️ La legende decrira des formes que la vue Semaine NE REND PAS (36.13 observation n16) — ecart assume, autre story. Baseline a reconfirmer (HEAD = acbd2e7, tree propre) : web 111 fichiers / 2117 tests, lint 142 (et NON 143, valeur perimee depuis la 36.11). VERIFICATION VISUELLE OBLIGATOIRE via Chrome MCP, trois themes, contexte de partie panneau ouvert, et MESURE que la barre tient sur UNE ligne a 1400 px — c'est le critere de fermeture de deferred-work.md:66. ⚠️ La branche TELEPHONE sera INVERIFIABLE a l'oeil : resize_window change outerWidth sans toucher innerWidth, donc matchMedia repond toujours true. QUATRE QUESTIONS POSEES : Q1 le scellement depuis la grille, sans story porteuse et demande pour la QUATRIEME fois depuis la 36.9 — 36.14 etant la derniere story de l'epic, c'est la derniere occasion de trancher ; Q2 /security-review, les artefacts se CONTREDISENT (36.8 et 36.5 la disent soldee, 36.9/36.11/36.12/36.13 et sprint-status:1343 la disent ouverte — deux traces contre huit, je retiens OUVERTE) ; Q3 les divergences de planche ; Q4 la legende livree malgre l'ecart de la vue Semaine. Cette story est front pure sans donnee nouvelle ni endpoint : elle N'AGGRAVE PAS la dette /security-review et ne la SOLDE PAS."
    title: "La barre repliée, la légende et les préférences"

