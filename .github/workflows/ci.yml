name: CI

on:
  pull_request:
  push:
    branches: [master]

# Un push de plus sur la même branche annule le run devenu obsolète.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Lecture seule : aucun job n'a besoin d'écrire dans le dépôt.
permissions:
  contents: read

env:
  # Validées au chargement par EmailModule (readMailConfig) : sans elles AppModule refuse de
  # démarrer. Aucune connexion SMTP n'est ouverte — nodemailer se connecte au premier envoi.
  MAIL_HOST: localhost
  MAIL_PORT: '1025'
  MAIL_FROM: ci@master-jdr.local

  # `prisma.config.ts` résout DATABASE_URL au CHARGEMENT de la config, donc toute commande
  # Prisma l'exige — y compris `generate`, qui ne se connecte pourtant jamais. D'où cette
  # valeur bidon au niveau workflow : elle n'a qu'à être bien formée. Le job e2e la surcharge
  # avec l'URL du service postgres, seul endroit où une base joignable est réellement requise.
  DATABASE_URL: postgresql://unused:unused@localhost:5432/unused?schema=public

jobs:
  # ── Types et build API ─────────────────────────────────────────────────────
  #
  # DÉLIBÉRÉMENT ABSENTS de cette CI, parce qu'ils échouent aujourd'hui sur de la dette
  # préexistante — les ajouter rendrait chaque PR rouge, y compris celles qui réparent :
  #   · `pnpm --filter web lint`  → 16 erreurs restantes (dont no-empty-function)
  #   · `pnpm --filter web build` → bundle initial 1.49 MB pour un budget d'erreur de 1 MB
  #                                 (angular.json). `ng serve` n'applique pas les budgets,
  #                                 d'où un build prod cassé sans que personne le voie.
  # Chacun est un chantier à part. À rebrancher ici dès qu'il est vert.
  #
  # Noter aussi que `typecheck` s'appuie sur tsconfig.build.json, qui exclut `test/` et
  # `**/*spec.ts` : les fichiers de test ne sont pas type-vérifiés.
  types-build:
    name: Types · build API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version lue dans packageManager (package.json)

      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Le client Prisma est généré, pas versionné : sans lui, tsc et eslint typé échouent.
      - run: pnpm --filter api exec prisma generate

      # `lint:check`, PAS `lint` : ce dernier contient `--fix` et corrigerait silencieusement
      # les violations auto-corrigeables avant de rapporter un succès — un garde-fou en trompe-l'œil.
      - run: pnpm --filter api lint:check
      - run: pnpm --filter api typecheck
      - run: pnpm --filter api build

  # ── Tests unitaires (api, web, game-rules) ─────────────────────────────────
  # Malgré son nom, ce job a besoin d'un Postgres : deux specs d'intégration vivent dans
  # `apps/api/src/` et sont donc ramassées par le testRegex de la config Jest unitaire
  # (`rootDir: src`, `.*\.spec\.ts$`). `notifications.integration.spec.ts` fait de vrais
  # `prisma.user.create()` et échoue sans base — c'est invisible en local, où le conteneur
  # `api` de docker-compose en a toujours une sous la main.
  unit:
    name: Tests unitaires
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jdr
          POSTGRES_PASSWORD: jdr
          POSTGRES_DB: jdr_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://jdr:jdr@localhost:5432/jdr_test?schema=public

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api exec prisma generate

      # notifications.integration.spec.ts écrit puis nettoie de vraies lignes : le schéma
      # doit exister.
      - run: pnpm --filter api exec prisma migrate deploy

      # `pnpm -r test` : jest (api), ng test/vitest (web), vitest (game-rules).
      # packages/shared n'a pas de script test et est simplement ignoré.
      #
      # Note : `email.integration.spec.ts` se saute lui-même si Mailpit est injoignable
      # (`if (!reachable) return`) et affiche donc PASS sans rien tester ici. Ajouter un
      # service mailpit (axllent/mailpit, ports 1025/8025) le ferait réellement tourner.
      - run: pnpm test

  # ── Tests e2e (Postgres réel) ──────────────────────────────────────────────
  e2e:
    name: Tests e2e
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jdr
          POSTGRES_PASSWORD: jdr
          POSTGRES_DB: jdr_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # PrismaService jette si DATABASE_URL est absent, et onModuleInit appelle $connect() :
      # app.e2e-spec.ts boote AppModule, il lui faut donc une base réellement joignable.
      DATABASE_URL: postgresql://jdr:jdr@localhost:5432/jdr_test?schema=public
      SESSION_SECRET: ci-secret-non-sensible
      WEB_ORIGIN: http://localhost:4200

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api exec prisma generate

      # `migrate deploy` (pas `dev`) : applique les migrations existantes sans en créer.
      - run: pnpm --filter api exec prisma migrate deploy

      - run: pnpm --filter api test:e2e

  # ── Porte unique pour la protection de branche ─────────────────────────────
  # Exiger CE check seul, jamais les jobs un par un : ajouter ou renommer un job plus tard
  # ne demandera aucune retouche des réglages GitHub.
  # Le nom du check exigé côté GitHub est l'id du job : « ci-ok ». Pas de `name:` ici,
  # pour qu'il ne puisse pas diverger du nom du workflow (« CI ») et créer une ambiguïté.
  ci-ok:
    if: always()
    needs: [types-build, unit, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Échouer si un job amont a échoué ou été annulé
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "Tous les jobs ont réussi."
