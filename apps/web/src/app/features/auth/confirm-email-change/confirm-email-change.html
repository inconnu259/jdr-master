<div class="auth-page">
  <mat-card class="auth-card">
    <mat-card-header><mat-card-title>Confirmer le changement d'adresse e-mail</mat-card-title></mat-card-header>
    <mat-card-content>
      @if (!token()) {
        <p class="error">Lien invalide.</p>
      }
      @if (confirmed()) {
        <p class="saved">Votre adresse e-mail a été changée.</p>
      } @else {
        @if (error()) {
          <p class="error">{{ error() }}</p>
        }
        <button mat-flat-button type="button" [disabled]="loading() || !token()" (click)="confirm()">
          Confirmer
        </button>
      }
    </mat-card-content>
    <mat-card-actions>
      <a routerLink="/login">Retour à la connexion</a>
    </mat-card-actions>
  </mat-card>
</div>
