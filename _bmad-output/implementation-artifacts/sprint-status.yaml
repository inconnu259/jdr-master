    note: "REVUE DE CODE (bmad-code-review) le 2026-08-22 : 3 couches paralleles (Blind Hunter, Edge Case Hunter, Acceptance Auditor), 5 patch tous corriges (focus jamais deplace dans le selecteur a l'ouverture, violant AC7 — ajoute via afterNextRender/viewChildren dans VoteAnswerPicker, ciblant ma reponse courante sinon la premiere entree ; ancre du selecteur jamais fermee sur changement de vue/mois/semaine ni sur rechargement SSE d'un tiers — closePicker() ajoute aux trois handlers de navigation et a l'effet SSE ; aria-label du bouton enveloppant masquait le nom accessible riche d'app-poll-track dans le rail et l'Agenda, aria-haspopup absent des 4 declencheurs — voteLabel()/voteAriaLabel() replient desormais participationAriaLabel() ; closePicker() appele AVANT l'attente de l'ecriture rendait le [busy] cable sur VoteAnswerPicker fonctionnellement mort — deplace apres le try/catch/finally ; message d'erreur du vote code en dur au lieu d'une cle de theme — nouvelle cle poll.cast_error posee dans les trois themes), 3 differes (rien n'empeche d'armer une nouvelle selection pendant que le selecteur de vote est ouvert, decision d'architecture hors AC ; countParticipants() sans gestion d'erreur, pre-existant 36.6 ; arrondi independant des trois segments de la piste, pre-existant 36.6), 6 rejetes dont 3 faux positifs verifies par lecture directe du code (onCellClick FULL_DAY sans $event est inoffensif — bandsAreUniform() exclut structurellement les rangs seance/vote ; type de cdkConnectedOverlayOrigin confirme correct par les Dev Notes/Context7 de la story ; assertion non-null pickerAnchor()! sure). Post-patch : API 60/60 suites, 1300/1300 tests ; web build compile (echoue seulement sur le budget de bundle pre-existant), 106/106 fichiers, 1859/1859 tests, lint web 143 = baseline. ❌ /SECURITY-REVIEW TOUJOURS DU sur l'epic (dette depuis la 36.4, explicitement due depuis la 36.6, rappelee par cette story). IMPLEMENTÉE le 2026-08-21 (bmad-dev-story), statut review initial. Front pur : aucun fichier apps/api ni packages/shared touché (confirme par git status), aucun endpoint, aucun DTO, aucune migration. Deux arbitrages tranches par l utilisateur au demarrage : <app-poll-response> retire du calendrier (et de lui seul, il reste dans la fiche de scenario), et selecteur ouvert a TOUT membre viewable, MJ compris. onPollResponded() retire avec son test (plus aucun appelant). DEUX DEFAUTS REELS TROUVES A L OEIL, aucun vu par les 1859 tests : (1) le selecteur etait TRANSPARENT — la planche contractuelle ecrit var(--sys-container), un jeton de maquette qui n existe pas dans styles.scss ; une variable CSS non resolue ne casse rien, le fond etait juste absent et les bandes du calendrier traversaient le panneau. Corrige en passant aux jetons du projet, et le marquage de ma reponse exprime par color-mix() au lieu du vert en dur du seul theme emeraude — le selecteur est desormais juste dans les trois themes. (2) la ligne de vote de l Agenda gardait le fond gris par defaut du navigateur. VERIFICATION VISUELLE REELLE FAITE sur les deux contextes et les quatre surfaces : piste 1/5 -> 2/5 en repondant et retour a 1/5 au retrait, repli vers le haut, case etroite en contexte de partie panneau ouvert, Echap sans effet, et une SELECTION ARMEE GARDE LE TAP (AC6). Les deux votes de test ont ete retires par le selecteur lui-meme, base laissee telle quelle. Web 106 fichiers / 1859 tests (baseline 105/1822), lint web 143 = baseline, API 60/1300 = baseline, typecheck propre. ATTENTION Task 0 NON FAITE : l override bmad-dev-story.user.toml interdit git add/git commit a l agent — c est tres probablement la cause premiere du commit incomplet de la 36.6. Les cinq fichiers de la 36.6 ET le vote-answer-picker/ de cette story sont a ajouter A LA MAIN avant de committer. /security-review reste DU sur l epic. --- Contexte de creation :  Front pur — aucun changement serveur, aucun DTO partagé, aucune migration : les routes POST/DELETE /parties/:id/poll/:pollId/vote existent