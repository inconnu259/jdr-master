<article
  class="event-card"
  [class.event-card--past]="past()"
  [class.event-card--imminent]="imminent()"
  [attr.aria-label]="card().title"
>
  <h4 class="event-card__title">{{ card().title }}</h4>
  <app-status-badge class="event-card__badge" [state]="badge()" />
  <p class="event-card__date">{{ dateLabel() }}</p>
  <p class="event-card__line event-card__host">{{ hostLabel() }}</p>
  @if (card().seance?.lieu; as lieu) {
    <p class="event-card__line event-card__place">{{ lieu }}</p>
  }
  <p class="event-card__line event-card__situation">
    <span class="event-card__situation-label">{{
      theme.tone()['partie.ralliement_event_situation']
    }}</span>
    <span class="event-card__chip" [class.event-card__chip--dotted]="situation().dotted">{{
      theme.tone()[situation().labelKey]
    }}</span>
  </p>
</article>
