@if (partieId) {
  <a mat-button [routerLink]="['/parties', partieId]">
    <mat-icon>arrow_back</mat-icon> {{ theme.tone()['common.retour_a_la_partie'] }}
  </a>
}
@if (loading()) {
  <p>{{ theme.tone()['common.chargement'] }}</p>
} @else if (loadError()) {
  <p class="error">{{ loadError() }}</p>
} @else if (scenario(); as s) {
  <app-scenario-editor [scenario]="s" />
}
