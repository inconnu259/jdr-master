<app-auth-band />
<main class="auth-page" aria-labelledby="auth-title">
  <mat-card class="auth-card">
    <mat-card-header>
      <h1 matCardTitle id="auth-title" class="auth-title">{{ tone()['auth.confirm_email_title'] }}</h1>
    </mat-card-header>
    <mat-card-content>
      @if (!token()) {
        <!-- Présent dès le chargement : texte simple, sans role="alert" -->
        <p class="error">{{ tone()['common.lien_invalide'] }}</p>
      }
      <!-- Conteneur persistant : présent avant l'action pour que l'annonce de la réussite ne soit pas perdue -->
      <div class="auth-status" role="status" tabindex="-1" #status>
        @if (confirmed()) {
          <p class="saved">{{ tone()['auth.confirm_email_done'] }}</p>
        }
      </div>
      @if (!confirmed()) {
        @if (error()) {
          <p class="error" role="alert">{{ error() }}</p>
        }
        <button
          mat-flat-button
          class="auth-primary"
          type="button"
          [disabled]="loading() || !token()"
          (click)="confirm()"
        >
          {{ tone()['common.confirmer'] }}
        </button>
      }
    </mat-card-content>
    <mat-card-actions class="auth-secondary-actions">
      <a class="auth-secondary-link" routerLink="/login">{{ tone()['common.retour_a_la_connexion'] }}</a>
    </mat-card-actions>
  </mat-card>
</main>
