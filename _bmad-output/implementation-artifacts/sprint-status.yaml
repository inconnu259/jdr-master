ate validée autorisée avec confirmation renforcée (patch), (4) champ libre scenarioRef confirmé supprimé (superseded par lien structuré scénario/séance, cf. 8-8) — + 6 patches techniques (tie-breaker createdAt, garde statut PASSE sur deleteSeance, garde seanceId/id et seanceId/isMjMode sur CalendarView, message d'erreur poll-creation, bouton annuler capacité) + 2 items différés (DTO dupliqué par choix d'architecture, confirmation sans compteur) + 4 écartés. Scope b-g du retour utilisateur post-revue élargi en nouvelle Story 8-8 (épisodique par vote multi-dates + refonte Oracle multi-votes), à faire juste après."

