<!-- AC10 : aucun vote ouvert ⇒ RIEN. Pas de bouton désactivé « pour une raison qu'on ignore ». -->
@if (polls().length > 0) {
  <div class="destiny">
    <button
      type="button"
      #chip
      class="destiny__chip"
      [class.destiny__chip--active]="active()"
      aria-haspopup="dialog"
      [attr.aria-expanded]="listOpen()"
      (click)="listRequested.emit()"
    >
      <app-icon class="destiny__glyph" name="destinee" />{{ chipLabel() }}
    </button>

    <!-- ⚠️ Story 44.4 — les chevrons parcourent les CRÉNEAUX du vote actif, plus les votes (on change de vote par
         la liste). Ils n'existent qu'à partir de DEUX créneaux : un seul n'a pas de « suivant », et des
         chevrons inertes mentiraient sur ce qui existe. -->
    @if (active() && slotCount() > 1) {
      <span class="destiny__nav">
        <button
          type="button"
          class="destiny__arrow"
          [attr.aria-label]="theme.tone()['calendar.destiny_prev_aria']"
          (click)="prevRequested.emit()"
        >
          <app-icon name="precedent" />
        </button>
        <span class="destiny__pos">{{ slotPosition() }} / {{ slotCount() }}</span>
        <button
          type="button"
          class="destiny__arrow"
          [attr.aria-label]="theme.tone()['calendar.destiny_next_aria']"
          (click)="nextRequested.emit()"
        >
          <app-icon name="suivant" />
        </button>
      </span>
    }
  </div>
}
