    note: "Implémentée le 2026-07-19 (bmad-dev-story). PasswordResetToken.token → tokenHash, haché via argon2 (AD-4). Token composite ${id}.${secret} : id sert de clé de recherche publique (un hash argon2 n'est pas indexable), secret est la seule donnée vérifiée par argon2.verify(), jamais stockée. Ordre critique : secret vérifié avant la réclamation atomique du token (updateMany), sinon une tentative avec un mauvais secret brûlerait le lien légitime. Migration créée manuellement (prisma migrate dev refuse l'environnement non interactif du conteneur) via prisma migrate diff + migrate deploy. Frontend inchangé (chaîne opaque unique). Revue de code le 2026-07-19 (3 couches adversariales) : 2 patches appliqués (argon2.verify/hash sortis de la transaction Prisma, limitée au claim atomique + mise à jour du mot de passe ; assertions de test corrigées), 2 items différés (voir deferred-work.md), reste écarté. Suite finale : 795/795 tests API (16/16 sur auth.service.spec.ts), typecheck propre, aucune régression. Statut passé à done."

